<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>UEP Climb Scheduler</title>
<meta name="theme-color" content="#191919">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='0' fill='%23191919'/%3E%3Cpath d='M5 25l8-12 5 7 4-5 6 10z' fill='none' stroke='%23f5ce97' stroke-width='2.6' stroke-linejoin='round'/%3E%3Ccircle cx='22' cy='8' r='2.2' fill='%23f5ce97'/%3E%3C/svg%3E" type="image/svg+xml">
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700&family=Poppins:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* Design language taken from upendingparkinsons.org (Squarespace 7.1 theme):
   near-black #191919, warm tan #ddcec0, off-white #eeedeb, olive #767365, honey #f5ce97;
   Manrope for headings, navigation and buttons, Poppins for body text; uppercase letter-spaced headings;
   square corners; outline primary buttons, solid olive action buttons; bottom-border form fields that scale up on focus;
   full-bleed black bands; elements fade and scale in (0.65s, ease).
   Layout: black page band on top, then a phone-sized app (wide desk for admin) with the tour and notes beside it.
   Big type and 48px+ touch targets stay: many users live with tremor or reduced dexterity.
   One deliberate light look, like the website, so it does not switch to a dark theme. */
:root{
  --ink:#191919; --tan:#ddcec0; --paper:#eeedeb; --olive:#767365; --olive-ink:#5f5c4b; --honey:#f5ce97;
  --bg:var(--paper); --surface:#faf9f6; --raised:#f4f2ed; --fg:var(--ink); --muted:#55534a; --line:#cbc4b8;
  --accent:var(--olive); --accent-ink:var(--olive-ink); --accent-fg:#ffffff; --accent-soft:#e7e4da;
  --sun:#6e4a00; --sun-bg:#f8e2bf;
  --ok:#2d6a45; --ok-bg:#dfeadf; --warn:#7f5300; --warn-bg:#f6e4c2; --bad:#9e2537; --bad-bg:#f4dcdc;
  --bar1:var(--ink); --bar2:var(--olive);
  --display:'Manrope','Helvetica Neue',Arial,sans-serif;
  --body:'Poppins',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  --ease:ease; --dur:.65s;
  color-scheme:light;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.65 var(--body);margin:0;padding:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.15;margin:0;text-wrap:balance}
h2{font-size:21px;text-transform:uppercase;letter-spacing:.06em}
h3{font-size:17px;font-weight:700}
p{margin:0}

/* Full-bleed black band, like the site's black sections */
.band{background:var(--ink);color:var(--paper);padding-inline:16px;padding-block:30px 34px;border-bottom:1px solid var(--ink)}
.wrap{max-width:1120px;margin-inline:auto;display:flex;flex-direction:column;gap:18px;padding-inline:16px;padding-block:28px 56px}
.top{max-width:1120px;margin-inline:auto;display:flex;flex-wrap:wrap;gap:14px 24px;align-items:flex-end;justify-content:space-between}
.top h1{font-size:clamp(30px,5vw,46px);font-weight:700;text-transform:uppercase;letter-spacing:.04em;line-height:1.05;color:var(--paper)}
.eyebrow{font-family:var(--display);font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--honey)}
.tag{font-family:var(--display);font-size:12px;letter-spacing:.14em;text-transform:uppercase;background:var(--honey);color:var(--ink);padding:5px 10px;font-weight:700}
.top small{color:var(--tan);font-size:14px}

.fb{display:inline-flex;align-items:center;min-height:46px;padding:10px 18px;border:2px solid var(--tan);color:var(--paper);font-family:var(--display);font-size:14px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;text-decoration:none;transition:background .25s var(--ease),color .25s var(--ease)}
.fb:hover{background:var(--tan);color:var(--ink)}

.stage{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:32px;align-items:start}
.stage.wide{grid-template-columns:minmax(0,1fr)}
@media (max-width:860px){.stage{grid-template-columns:minmax(0,1fr)}}

/* Phone frame keeps rounded corners; everything inside is square like the website */
.device{background:var(--surface);border:1px solid var(--ink);border-radius:30px;overflow:hidden;display:flex;flex-direction:column;height:800px;max-height:calc(100vh - 120px);min-height:620px;position:relative;box-shadow:0 18px 40px rgba(25,25,25,.18)}
.stage.wide .device{border-radius:0;height:auto;max-height:none;min-height:0}
@media (max-width:860px){.device{max-height:none;height:760px}}
.appbar{padding:14px 18px 12px;background:var(--tan);border-bottom:1px solid var(--ink);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.appbar .brand{display:flex;align-items:center;gap:10px}
.appbar .brand b{font-family:var(--display);font-size:16px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.mark{width:30px;height:30px;background:var(--ink);display:grid;place-items:center}
.mark svg{width:18px;height:18px}
.mark svg path,.mark svg circle{stroke:var(--honey)}
.who{font-size:13px;color:var(--ink);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.linkbtn{border:0;background:none;color:var(--ink);font-family:var(--display);font-weight:700;padding:6px 2px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;text-decoration:underline;text-underline-offset:4px}
.switch{display:flex;border:1px solid var(--ink)}
.switch button{border:0;background:var(--surface);padding:6px 10px;font-family:var(--display);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}
.switch button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
#screen{flex:1;overflow-y:auto;padding:20px 18px;display:flex;flex-direction:column;gap:16px}
.stage.wide #screen{overflow:visible;padding:24px}
.tabbar{display:flex;border-top:1px solid var(--ink);background:var(--surface)}
.stage.wide .appbar{order:-2}
.stage.wide .tabbar{order:-1;border-top:0;border-bottom:1px solid var(--line);padding-inline:12px}
.tabbar button{flex:1;border:0;background:none;padding:14px 6px;font-family:var(--display);font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);min-height:54px;transition:color .25s var(--ease)}
.tabbar button[aria-current="page"]{color:var(--ink);box-shadow:inset 0 3px 0 var(--ink)}
.stage.wide .tabbar button{flex:0 0 auto;padding-inline:18px}
.stage.wide .tabbar button[aria-current="page"]{box-shadow:inset 0 -3px 0 var(--ink)}

.card{background:var(--raised);border:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.muted{color:var(--muted);font-size:15px}
.ptag{margin-top:28px;text-align:center;font-size:12px;color:var(--muted);opacity:.85}
.ptag a{color:inherit;text-decoration:none;border-bottom:1px solid var(--line)}
.ptag a:hover,.ptag a:focus-visible{color:var(--fg)}
.small{font-size:14px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}

/* Buttons: solid olive for the main action, square outline for secondary, both uppercase Manrope */
.btn{border:2px solid var(--accent);background:var(--accent);color:var(--accent-fg);padding:13px 20px;font-family:var(--display);font-size:15px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;text-align:center;min-height:52px;transition:background .25s var(--ease),color .25s var(--ease),border-color .25s var(--ease)}
.btn:hover:not([disabled]){background:var(--ink);border-color:var(--ink)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--ink)}
.btn.ghost:hover:not([disabled]){background:var(--ink);color:var(--paper)}
.btn.quiet{background:var(--surface);color:var(--ink);border:1px solid var(--line);text-transform:none;letter-spacing:.01em;font-size:15px}
.btn.quiet:hover:not([disabled]){background:var(--paper);border-color:var(--ink)}
.btn.sm{padding:9px 14px;min-height:46px;font-size:13px}
.btn.quiet.sm{font-size:15px}
.btn.full{width:100%}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.pill{font-family:var(--display);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;background:var(--accent-soft);color:var(--accent-ink);white-space:nowrap}
.pill.sun{background:var(--sun-bg);color:var(--sun)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.plain{background:transparent;color:var(--muted);border:1px solid var(--line)}
.notice{padding:12px 14px;font-size:15px;background:var(--warn-bg);border-left:4px solid var(--warn)}
.notice.ok{background:var(--ok-bg);border-color:var(--ok)}
.notice.info{background:var(--accent-soft);border-color:var(--olive)}
.notice b{display:block;margin-bottom:2px;font-family:var(--display)}
.hero{background:var(--ink);color:var(--paper);padding:22px 20px;display:flex;flex-direction:column;gap:10px}
.hero .small{color:var(--honey);font-family:var(--display);font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:1!important}
.hero .big{font-family:var(--display);font-size:26px;font-weight:700;line-height:1.1;text-transform:uppercase;letter-spacing:.03em}
.hero .btn{background:var(--tan);border-color:var(--tan);color:var(--ink)}
.hero .btn:hover:not([disabled]){background:var(--paper);border-color:var(--paper)}
.hero .btn.ghost{background:transparent;color:var(--paper);border-color:var(--tan)}
.hero .btn.ghost:hover:not([disabled]){background:var(--tan);color:var(--ink)}

/* Form fields: square, bottom border only, scale up slightly on focus */
label.f{display:flex;flex-direction:column;gap:6px;font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.04em}
input[type=text],input[type=email],input[type=tel],input[type=time],input[type=number],input[type=date],textarea,select{font:inherit;font-family:var(--body);font-size:16px;font-weight:400;letter-spacing:0;color:var(--fg);background:var(--surface);border:0;border-bottom:2px solid var(--ink);border-radius:0;padding:12px;width:100%;min-height:50px;transition:transform .25s var(--ease),background .25s var(--ease)}
input:focus,textarea:focus,select:focus{transform:scale(1.015);background:#ffffff}
textarea{min-height:80px;resize:vertical}
input[type=date]{min-width:0;max-width:100%}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--ink);background:var(--surface);padding:9px 14px;font-size:15px;min-height:44px;transition:background .2s var(--ease),color .2s var(--ease)}
.chip:hover{background:var(--paper)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper);font-weight:700}
.check{display:flex;gap:12px;align-items:flex-start;font-size:16px;cursor:pointer}
.check input{margin-top:2px;width:26px;height:26px;accent-color:var(--ink);flex:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}
.grid3{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:10px}
.rrow{display:flex;gap:8px;align-items:stretch}
.rrow .person{flex:1;min-width:0}
#screen>*{flex-shrink:0}
.waiver{max-height:min(360px,48vh);overflow-y:auto;border:1px solid var(--ink);background:var(--surface);padding:18px 20px;font-size:15px;line-height:1.7;display:flex;flex-direction:column;gap:12px}
.waiver .wt{font-family:var(--display);font-weight:700;font-size:16px;line-height:1.3;text-transform:uppercase;letter-spacing:.06em}
.waiver p{max-width:60ch}
.waiver p b{display:block;font-family:var(--display);font-weight:700;font-size:15px;margin-bottom:2px}
.waiver .hint{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.steps{display:flex;gap:6px}
.steps i{flex:1;height:4px;background:var(--line)}
.steps i.on{background:var(--ink)}
.code{font-family:var(--display);letter-spacing:.4em;font-size:24px;text-align:center}

/* roster */
.roster{display:flex;flex-direction:column;gap:8px}
.person{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);background:var(--surface);min-height:64px;width:100%;text-align:left;transition:background .2s var(--ease),border-color .2s var(--ease)}
.person:hover{border-color:var(--ink)}
.person[aria-pressed="true"]{background:var(--ok-bg);border-color:var(--ok)}
.tick{width:34px;height:34px;border:2px solid var(--ink);flex:none;display:grid;place-items:center;background:var(--surface)}
.person[aria-pressed="true"] .tick{background:var(--ok);border-color:var(--ok)}
.tick svg{width:20px;height:20px;opacity:0;color:#ffffff!important}
.person[aria-pressed="true"] .tick svg{opacity:1}
.person .nm{font-weight:700;font-size:16px}
.person .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.tally{font-family:var(--display);font-size:40px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.tally span{font-size:18px;color:var(--muted);font-weight:500}

/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{border:1px solid var(--line);border-top:3px solid var(--ink);padding:14px 16px;background:var(--raised);display:flex;flex-direction:column;gap:4px}
.kpi .n{font-family:var(--display);font-size:34px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.kpi .l{font-family:var(--display);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kpi.flag{border-top-color:var(--warn);background:var(--warn-bg)}
.split{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.split{grid-template-columns:minmax(0,1fr)}}
.scroll-x{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-family:var(--display);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;border-bottom:2px solid var(--ink)}
td.num,th.num{text-align:right}
.meter{height:8px;background:var(--line);overflow:hidden;min-width:70px}
.meter i{display:block;height:100%;background:var(--ok)}
.meter.low i{background:var(--bad)}
.meter.mid i{background:var(--warn)}
.legend{display:flex;gap:14px;font-size:14px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;margin-right:6px;vertical-align:-1px}
svg text{fill:var(--muted);font-family:var(--body);font-size:12px}

/* schedule builder */
.datechips{display:flex;flex-wrap:wrap;gap:8px}
.datechip{border:1px solid var(--ink);background:var(--surface);padding:8px 12px;font-size:15px;min-height:44px}
.datechip[aria-pressed="true"]{text-decoration:line-through;color:var(--muted);background:var(--raised);border-color:var(--line)}

/* notes and tour */
.notes{display:flex;flex-direction:column;gap:14px;min-width:0}
.notes h2{font-size:22px}
.notes ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.try{background:var(--surface);border:1px solid var(--ink);padding:18px;display:flex;flex-direction:column;gap:10px}
.try ul{margin:0}
.tour{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;counter-reset:stop}
.tour > li{background:var(--surface);border:1px solid var(--line);padding:16px 18px;display:flex;flex-direction:column;gap:8px;counter-increment:stop;transition:border-color .25s var(--ease)}
.tour > li:hover{border-color:var(--ink)}
.tour > li.here{border-color:var(--ink);box-shadow:inset 4px 0 0 var(--ink)}
.tour .who{font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:.04em;text-transform:uppercase}
.tour .who::before{content:counter(stop) ". ";color:var(--olive-ink)}
.tour ul{margin:0;padding-left:20px;font-size:15px;display:flex;flex-direction:column;gap:4px}
.stage.wide .notes{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px 28px;align-items:start}
.stage.wide .notes > .intro{display:flex;flex-direction:column;gap:12px}
@media (max-width:860px){.stage.wide .notes{grid-template-columns:minmax(0,1fr)}}
.try h3{margin-bottom:6px;text-transform:uppercase;letter-spacing:.06em;font-size:15px}
.foot{font-size:13px;color:var(--muted)}
.req{font-family:var(--display);font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--olive-ink)}
.req b{color:var(--fg)}

.toast{position:absolute;left:16px;right:16px;bottom:78px;background:var(--ink);color:var(--paper);padding:14px 16px;font-size:15px;border-left:4px solid var(--honey);box-shadow:0 10px 26px rgba(25,25,25,.3);z-index:5}
.stage.wide .toast{position:fixed;left:50%;right:auto;bottom:24px;transform:translateX(-50%);max-width:min(560px,calc(100vw - 32px))}

/* The website's motion: elements fade and scale in, 0.65s ease. Runs on page load and when the screen changes, not on every tap. */
@media (prefers-reduced-motion:no-preference){
  @keyframes uepIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
  .band .top > *{animation:uepIn var(--dur) var(--ease) both}
  .band .top > *:nth-child(2){animation-delay:.12s}
  .enter > *,.enter-notes > *{animation:uepIn var(--dur) var(--ease) both}
  .enter > *:nth-child(2),.enter-notes > *:nth-child(2){animation-delay:.06s}
  .enter > *:nth-child(3),.enter-notes > *:nth-child(3){animation-delay:.12s}
  .enter > *:nth-child(n+4),.enter-notes > *:nth-child(n+4){animation-delay:.18s}
  .toast{animation:uepIn .3s var(--ease) both}
}
</style>
<style>[hidden]{display:none!important} img{max-width:100%}</style>

<header class="band">
  <div class="top">
    <div class="stack" style="gap:4px">
      <span class="eyebrow">Up ENDing Parkinson's</span>
      <h1>Climb Scheduler</h1>
    </div>
    <div class="row" style="justify-content:flex-start"><span class="tag">Clickable prototype &middot; Version 2</span> <small>Sample data only. Built by Positive Tribes.</small> <a class="fb" href="https://uep.positivetribes.org/" target="_blank" rel="noopener">Questions and feedback &#8599;</a></div>
  </div>
</header>
<div class="wrap">
  <div id="main"></div>
</div>

<script>
/* ---------- Dates and recurrence ---------- */
const DAY = 864e5;
const DOW = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const DOWS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const NTH = {1:'First',2:'Second',3:'Third',4:'Fourth','-1':'Last'};
const today = (()=>{const d=new Date();d.setHours(0,0,0,0);return d})();
const addDays=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const fromIso=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const fmt=d=>d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
const fmtLong=d=>d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
const weekStart=d=>addDays(d,-d.getDay());
function t12(t){if(!t)return'';let [h,m]=t.split(':').map(Number);const ap=h>=12?'pm':'am';h=h%12||12;return `${h}:${String(m).padStart(2,'0')}${ap}`}

function matches(r,d){
  if(r.skip&&r.skip.includes(iso(d)))return false;
  if(r.freq==='once')return iso(d)===r.date;
  if(r.freq==='weekly'){
    if(!r.days.includes(d.getDay()))return false;
    const weeks=Math.round((weekStart(d)-weekStart(fromIso(r.start)))/(7*DAY));
    return weeks>=0&&weeks%(r.interval||1)===0;
  }
  if(r.freq==='monthly'){
    if(d.getDay()!==r.day)return false;
    // nth can be one week of the month or several, such as 1st and 3rd
    return [].concat(r.nth).some(n=>+n===-1?addDays(d,7).getMonth()!==d.getMonth():Math.ceil(d.getDate()/7)===+n);
  }
  return false;
}
function nextDates(r,n,from=today,includeSkipped=false){
  const out=[];const rr=includeSkipped?{...r,skip:[]}:r;
  for(let i=0;i<500&&out.length<n;i++){const d=addDays(from,i);if(matches(rr,d))out.push(d)}
  return out;
}
function ruleText(r){
  if(r.freq==='once')return 'One time, '+fmt(fromIso(r.date));
  if(r.freq==='monthly')return `${andList([].concat(r.nth).map(Number).sort((a,b)=>(a<0?9:a)-(b<0?9:b)).map(n=>NTH[n]))} ${DOW[r.day]} of each month`;
  return (r.interval===2?'Every other ':'Every ')+andList(r.days.slice().sort().map(x=>DOW[x]));
}
function andList(a){return a.length>1?a.slice(0,-1).join(', ')+' and '+a.at(-1):a[0]}

function bookedThrough(r){const ds=nextDates(r,40).filter(d=>d<=addDays(today,AHEAD));return ds.at(-1)}

}

// Sample check-ins for every past session, from a fixed seed so the same month always downloads the same names
const FIRSTN=['Alan','Barbara','Carl','Diane','Ellen','Frank','Gail','Hank','Irene','Jim','Karen','Larry','Marsha','Ned','Olive','Paul','Rita','Stan','Teresa','Vern','Wanda','Yusuf','Bea','Cy','Doris','Gus','June','Lou','Mae','Otto'];
const LASTN=['Abbott','Brandt','Castillo','Dunn','Ellis','Ferris','Grant','Hollis','Ibarra','Jansen','Keller','Lowry','Mercer','Nolan','Ortiz','Pruitt','Quinn','Russo','Sato','Tran','Vance','Weber','Young','Zeller'];
function seeded(key){let h=2166136261;for(const c of key)h=Math.imul(h^c.charCodeAt(0),16777619);
  return()=>{h=Math.imul(h^h>>>15,2246822507);h=Math.imul(h^h>>>13,3266489909);h^=h>>>16;return(h>>>0)/4294967296}}
function regularsOf(s){
  const r=seeded('reg'+s.id),out=s.site==='gol'?state.roster.filter(x=>x.w).map(x=>({n:x.n,cp:x.cp})):[],seen=new Set(out.map(x=>x.n));
  while(out.length<Math.round(s.cap*1.2)){const n=FIRSTN[Math.floor(r()*FIRSTN.length)]+' '+LASTN[Math.floor(r()*LASTN.length)];if(!seen.has(n)){seen.add(n);out.push({n,cp:r()<.15})}}
  return out;
}
// Dates a session was held in a month, up to yesterday. Skipped dates don't count.
function heldDates(s,y,m){
  const r={...s.rule,start:iso(addDays(fromIso(s.rule.start),-728))},out=[];
  for(let d=new Date(y,m,1);d.getMonth()===m&&d<today;d=addDays(d,1))if(matches(r,d))out.push(d);
  return out;
}
function monthAttendance(sites,ym){
  const [y,m]=ym.split('-').map(Number),ids=sites.map(s=>s.id),rows=[];
  state.sessions.filter(s=>ids.includes(s.site)).forEach(s=>{const regs=regularsOf(s);
    heldDates(s,y,m-1).forEach(d=>{const r=seeded(s.id+iso(d)),people=[];
      regs.forEach(p=>{if(people.length<s.cap&&r()<.68)people.push({n:p.n,kind:p.cp?'Care partner':''})});
      const walk=Math.floor(r()*3);for(let i=0;i<walk;i++)people.push({n:FIRSTN[Math.floor(r()*FIRSTN.length)]+' '+LASTN[Math.floor(r()*LASTN.length)],kind:'Walk-in'});
      rows.push({d,s,people:people.sort((a,b)=>a.n.localeCompare(b.n))})})});
  return rows.sort((a,b)=>a.d-b.d||a.s.from.localeCompare(b.s.from));
}
const monthName=ym=>{const [y,m]=ym.split('-').map(Number);return new Date(y,m-1,1).toLocaleDateString('en-US',{month:'long',year:'numeric'})};
const lastMonths=n=>Array.from({length:n},(_,i)=>iso(new Date(today.getFullYear(),today.getMonth()-i,1)).slice(0,7));
const siteLabel=s=>s.gym==='Partner gym'?s.city:s.gym;
const funderTitle=ss=>state.filter.by==='gyms'&&ss.length<=3?ss.map(siteLabel).join(', '):filterTitle(ss);
function attendanceSheet(XLSX,sites,title,ym){
  const rows=monthAttendance(sites,ym),aoa=[[`Attendance for ${title}, ${monthName(ym)}`],['Everyone checked in at each session, including care partners and walk-ins.'],[],['Date','Site and session','Checked in']];
  rows.forEach(x=>{aoa.push([fmt(x.d),`${siteLabel(site(x.s.site))} · ${x.s.name} · ${t12(x.s.from)}`,x.people.length]);x.people.forEach(p=>aoa.push(['',p.n,p.kind]));aoa.push([])});
  if(!rows.length)aoa.push(['No sessions held this month.'],[]);
  aoa.push(['Sessions',rows.length],['Check-ins',rows.reduce((a,x)=>a+x.people.length,0)],['Different people',new Set(rows.flatMap(x=>x.people.map(p=>p.n))).size]);
  const ws=XLSX.utils.aoa_to_sheet(aoa);ws['!cols']=[{wch:14},{wch:44},{wch:12}];
  return ws;
}
let xlsxLoad;
function loadXLSX(){return xlsxLoad||(xlsxLoad=new Promise((ok,no)=>{const t=document.createElement('script');t.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';t.onload=()=>ok(window.XLSX);t.onerror=()=>{xlsxLoad=null;no()};document.head.appendChild(t)}))}
async function funderDownload(sites,title,months){
  try{
    const XLSX=await loadXLSX(),wb=XLSX.utils.book_new();
    months.slice().reverse().forEach(ym=>XLSX.utils.book_append_sheet(wb,attendanceSheet(XLSX,sites,title,ym),monthName(ym)));
    const when=months.length>1?`${monthName(months.at(-1))} to ${monthName(months[0])}`:monthName(months[0]);
    XLSX.writeFile(wb,`UEP attendance, ${title}, ${when}.xlsx`.replace(/[\\/:*?"<>|]/g,''));
    say(`Attendance for ${title}, ${when}, downloaded as a spreadsheet.`);
  }catch(e){say('The download didn\'t work. Check your connection and try again.')}
  render();
}

function draftFrom(s){const r=s.rule;return {editId:s.id,name:s.name,freq:r.freq,days:r.days||[3],interval:r.interval||1,nth:[].concat(r.nth||1).map(Number),mday:r.day??6,date:r.date||iso(addDays(today,14)),from:s.from,to:s.to,cap:s.cap,tbc:s.tbc,skip:[...(r.skip||[])]}}

function leadDates(){
  const ss=leadSessions();

  const past=ss.flatMap(s=>nextDates(s.rule,6,addDays(today,-28)).filter(d=>d<today).map(d=>({s,d,past:true}))).sort((a,b)=>a.d-b.d).slice(-2);

function leadDay(){
  const ds=leadDates();if(!ds.length)return null;
  const f=ds.findIndex(y=>!y.past),i=state.leadDay==null?f:Math.min(state.leadDay,ds.length-1),x=ds[i],k=x.s.id+'|'+iso(x.d),rel=Math.abs(i-f);

  return {ds,i,x,K,first:i===f,past:!!x.past,open:i===f||!!x.past};
}

function newDraft(){return {name:'',freq:'weekly',days:[3],interval:1,nth:[1],mday:2,date:iso(addDays(today,14)),from:'10:00',to:'11:30',cap:12,tbc:false,skip:[]}}
function draftRule(D){
  if(D.freq==='once')return {freq:'once',date:D.date,skip:[]};
  if(D.freq==='monthly')return {freq:'monthly',nth:D.nth,day:D.mday,skip:D.skip};
  const days=D.days.length?D.days:[3];let first=today;
  for(let i=0;i<7;i++){const d=addDays(today,i);if(days.includes(d.getDay())){first=d;break}}
  return {freq:'weekly',days,interval:D.interval,start:iso(first),skip:D.skip};
}

  const key=[r,state.tab[r]||'',state.waiver.step,state.login.step,state.draft?1:0].join('|');
  if(key!==lastKey){if(ns)ns.classList.add('enter');const nt=$('.notes');if(nt)nt.classList.add('enter-notes');lastKey=key}
  if(state.toast){const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=state.toast;$('#device').appendChild(t)}
}

/* ---------- Actions ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,v=el.dataset.v,L=state.login,W=state.waiver;
  if(a==='fill'){L.email=v;L.step=2;L.sent=v;L.code='123456'}
  else if(a==='sendcode'){L.sent=L.email.trim();L.step=2;L.code='123456'}
  else if(a==='back1'){L.step=1;L.code=''}
  else if(a==='tourgo'){state.user=null;state.mode=null;state.tab={};state.draft=null;L.sent=v;L.code='123456';doVerify();window.scrollTo(0,0)}
  else if(a==='verify')doVerify();
  else if(a==='signout'){state.user=null;state.mode=null;state.tab={};state.draft=null}
  else if(a==='mode'){state.mode=v}
  else if(a==='tab'){state.tab[role()]=v}
  else if(a==='wstep')W.step=+v;
  else if(a==='wtype'){W.type=v}
  else if(a==='wcopy'){say('Opens a PDF of the exact waiver signed, with name, date, time and version. Coming in the full build.')}
  else if(a==='sign'){const p=me();p.waiver=iso(today);p.ec=`${W.ecName}, ${W.ecPhone}`;p.type=W.type;p.address=W.address;p.home=W.home;if(W.phone.trim())p.phone=W.phone.trim();state.findSite=W.home;p.birth=W.dobY&&W.dobM&&W.dobD?W.dobY+'-'+W.dobM+'-'+W.dobD:'';p.signedAt=new Date();p.signedName=W.name.trim();p.wver='2026-2';say('Waiver signed. You can book any session now.');state.tab.climber='find'}
  else if(a==='miss'){me().missed.push(v);say('Got it. Your spot is free for someone on the waitlist.')}
  else if(a==='undomiss'){const p=me();p.missed=p.missed.filter(x=>x!==v);say('Great, you\'re back on the list.')}
  else if(a==='stand'){const p=me(),s=sess(v);p.standing.push(v);(p.until||(p.until={}))[v]=iso(addDays(today,AHEAD));s.booked++;say(`Booked: ${ruleText(s.rule)}. You're booked through ${fmt(bookedThrough(s.rule))}, and we'll check with you before then to keep it going.`)}
  else if(a==='once'){const p=me(),s=sess(v);p.once.push({id:v,date:iso(nextOf(s))});s.booked++;say('Booked for '+fmt(nextOf(s))+'.')}
  else if(a==='unstand'){const p=me(),s=sess(v);p.standing=p.standing.filter(x=>x!==v);p.away=(p.away||[]).filter(x=>x.id!==v);if(p.end)delete p.end[v];if(state.awayEdit===v)state.awayEdit=null;s.booked=Math.max(0,s.booked-1);say('Regular booking cancelled. The spot is open for someone else.')}
  else if(a==='keep'){const p=me();p.until[v]=iso(addDays(today,AHEAD));say(`You're booked through ${fmt(standDates(p,v).at(-1))}. We'll check with you again before then.`)}
  else if(a==='oncedel'){const p=me(),[id,d]=v.split('|');p.once=p.once.filter(o=>!(o.id===id&&o.date===d));sess(id).booked=Math.max(0,sess(id).booked-1);say('Cancelled. The spot is open for someone else.')}
  else if(a==='awayopen'){state.awayEdit=state.awayEdit===v?null:v;state.aw={from:'',to:'',end:''}}
  else if(a==='awayclose')state.awayEdit=null;
  else if(a==='awaysave'){const p=me(),A=state.aw;(p.away||(p.away=[])).push({id:state.awayEdit,from:A.from,to:A.to});state.awayEdit=null;say(`Away ${fmt(fromIso(A.from))} to ${fmt(fromIso(A.to))}. Those dates are open for others, and your booking picks up again after.`)}
  else if(a==='endsave'){const p=me(),A=state.aw;(p.end||(p.end={}))[state.awayEdit]=A.end;state.awayEdit=null;say(`Your booking ends after ${fmt(fromIso(A.end))}. Later dates are open for others.`)}
  else if(a==='awaydel'){me().away.splice(+v,1);say('Away dates removed. You\'re booked on those dates again.')}
  else if(a==='enddel'){delete me().end[v];say('End date removed. Your booking carries on.')}
  else if(a==='apick'){state.adminPick=v}
  else if(a==='aser'){const P=state.people[state.adminPick],s=sess(v);P.standing=P.standing.filter(x=>x!==v);s.booked=Math.max(0,s.booked-1);say(`${P.name}'s ${s.name} booking is cancelled, and they got a text. The spot is open again.`)}
  else if(a==='adate'){const P=state.people[state.adminPick],[id,d,st]=v.split('|');if(st==='1')P.missed.push(id+'|'+d);else P.once=P.once.filter(o=>!(o.id===id&&o.date===d));say(`${P.name} is cancelled for ${fmt(fromIso(d))} and got a text. Their other dates stay booked.`)}
  else if(a==='nsopen')state.newSite={gym:'',lead:'',city:'',st:'',region:'East',price:'Free',fund:'UEP'};
  else if(a==='nsclose')state.newSite=null;
  else if(a==='nssave'){const N=state.newSite;SITES.push({id:'x'+Date.now(),city:N.city.trim()+', '+N.st.trim().toUpperCase(),gym:N.gym.trim(),region:N.region,lead:N.lead.trim(),free:/^free$/i.test(N.price.trim()),price:N.price.trim()||'Free',fund:N.fund.trim(),sessions:0,rec:0,booked:0,checked:0,act:0,cp:0});state.added++;state.newSite=null;say(`${N.gym.trim()} added. Climbers can pick it now, and its leads can set up sessions.`)}
  else if(a==='waitlist'){const p=me(),s=sess(v);if(!p.wl.includes(v)){p.wl.push(v);s.wait++}const ld=site(s.site).lead.split(',')[0];say(`You're on the waitlist. ${ld}, the lead volunteer, has been emailed.`)}
  else if(a==='toggle'){const K=leadDay().K,n=K.list[+v].n;K.checked.has(n)?K.checked.delete(n):K.checked.add(n);K.done=false}
  else if(a==='addwalk'){const K=leadDay().K,n=state.walkin.trim();K.list.push({n,w:false,cp:false,walk:true});K.checked.add(n);state.walkin='';K.done=false}
  else if(a==='lday'){state.leadDay=+v;state.addName='';state.walkin=''}
  else if(a==='lcancel'){const {K,x}=leadDay(),[r]=K.list.splice(+v,1);K.checked.delete(r.n);x.s.booked=Math.max(0,x.s.booked-1);say(`${r.n} is cancelled for ${fmt(x.d)} and got a text. Their other bookings stay.`)}
  else if(a==='lsign'){const {K,x}=leadDay(),n=state.addName;K.list.push({n,w:true,cp:false,byLead:true});x.s.booked++;state.addName='';say(v==='stand'?`${n} is booked ${ruleText(x.s.rule).replace(/^\w/,c=>c.toLowerCase())}, and got a text.`:`${n} is booked for ${fmt(x.d)}, and got a text.`)}
  else if(a==='finish'){
    const {K,past,x}=leadDay(),g=site('gol');if(!K.done){g.rec=Math.min(g.sessions,g.rec+1);g.checked+=K.checked.size}
    K.done=true;say(past?`Attendance for ${fmt(x.d)} saved from the paper list. Molly's dashboard now includes it.`:'Attendance saved. Molly\'s dashboard now includes it.');
  }
  else if(a==='newsess')state.draft=newDraft();
  else if(a==='editsess'){state.draft=draftFrom(sess(v));$('#screen')&&($('#screen').scrollTop=0)}
  else if(a==='cancelsess')state.draft=null;
  else if(a==='report'&&v==='board')say('Board report downloaded as a spreadsheet.');
  else if(a==='report'){funderDownload([site(v)],siteLabel(site(v)),state.fmonth==='six'?lastMonths(6):[state.fmonth]);return}
  else if(a==='funder'){const ss=sitesView();funderDownload(ss,funderTitle(ss),state.fmonth==='six'?lastMonths(6):[state.fmonth]);return}
  else if(a==='dfreq'){const D=state.draft;D.skip=[];if(v==='biweekly'){D.freq='weekly';D.interval=2}else if(v==='weekly'){D.freq='weekly';D.interval=1}else D.freq=v}
  else if(a==='dnth'){const D=state.draft,k=+v;D.nth=D.nth.includes(k)?(D.nth.length>1?D.nth.filter(x=>x!==k):D.nth):[...D.nth,k];D.skip=[]}
  else if(a==='dday'){const D=state.draft,i=+v;D.days=D.days.includes(i)?D.days.filter(x=>x!==i):[...D.days,i];D.skip=[]}
  else if(a==='dskip'){const D=state.draft;D.skip=D.skip.includes(v)?D.skip.filter(x=>x!==v):[...D.skip,v]}
  else if(a==='savesess'&&state.draft.editId){const D=state.draft,s=sess(D.editId),r=draftRule(D);if(D.freq==='weekly'&&s.rule.freq==='weekly')r.start=s.rule.start;Object.assign(s,{name:D.name.trim(),rule:r,from:D.from,to:D.to,cap:+D.cap||s.cap,tbc:D.tbc});let n=0;if(s.booked<s.cap&&s.wait){n=Math.min(s.wait,s.cap-s.booked);s.wait-=n;s.booked+=n}state.draft=null;say(n?`Changes saved. ${n} ${n===1?'person':'people'} moved off the waitlist and got a text.`:'Changes saved. People booked into this session get a text about the change.')}
  else if(a==='savesess'){const D=state.draft;state.sessions.push({id:'n'+Date.now(),site:me().lead,name:D.name.trim(),rule:draftRule(D),from:D.from,to:D.to,cap:+D.cap||12,booked:0,tbc:D.tbc});state.draft=null;say('Session saved. Climbers can book it now.')}
  else if(a==='fgym'){const F=state.filter;F.gyms=F.gyms.includes(v)?(F.gyms.length>1?F.gyms.filter(x=>x!==v):F.gyms):[...F.gyms,v]}
  else if(a==='nudge'){state.nudged.add(+v);say('Note sent: "We miss you at climbing. Want to come back this week?"')}
  else if(a==='drop'){const d=state.drift[+v];state.dropped.add(+v);say(`${d.n}'s booking (${d.was.replace(/^\w/,c=>c.toLowerCase())}) is cancelled, and the spot is open again. They got a text and can book again any time.`)}
  render();
  if(['tab','verify','signout','mode','wstep','sign','fill','sendcode','tourgo'].includes(a)){const s=$('#screen');if(s)s.scrollTop=0}
});
function doVerify(){
  const L=state.login,typed=L.sent.trim().toLowerCase(),found=findPerson(typed),k=found||typed,byOther=found&&found!==typed;
  if(!found){const ph=!typed.includes('@')&&digits(typed).length>=10;state.people[k]={name:ph?'New climber':k.split('@')[0].replace(/[._]/g,' ').replace(/\b\w/g,c=>c.toUpperCase()),phone:ph?L.sent.trim():'',roles:['climber'],type:'',address:'',wl:[],home:null,waiver:null,ec:'',standing:[],until:{},away:[],end:{},once:[],missed:[]}}
  state.user=k;state.mode=null;state.leadDay=null;state.awayEdit=null;state.addName='';L.step=1;L.email='';L.code='';
  state.waiver={step:1,ack1:false,ack2:false,name:'',proxy:false,proxyName:'',proxyRel:'Spouse or partner',dobM:'',dobD:'',dobY:'',home:'',ecName:'',ecPhone:'',type:'',address:'',phone:me().phone||''};
  state.findSite=me().home||'gol';
  const r=role();if(byOther){say(`Signed in. ${L.sent.trim()} belongs to ${me().name}, so this is the same account and the same bookings.`);return}
  say(r==='admin'?'Signed in. You have admin access to every site.':r==='lead'?'Signed in. You and Jo Kim lead the Golden site, and you climb there too.':r==='waiver'?'Signed in. One quick step before your first climb.':'Signed in.');
}
document.addEventListener('input',e=>{
  const k=e.target.dataset&&e.target.dataset.bind;if(!k)return;
  const val=e.target.type==='checkbox'?e.target.checked:e.target.value,W=state.waiver,D=state.draft;
  if(k==='email'){state.login.email=val;const b=$('[data-act="sendcode"]');if(b)b.disabled=!val.trim();return}
  if(k==='code'){state.login.code=val.replace(/\D/g,'').slice(0,6);const b=$('[data-act="verify"]');if(b)b.disabled=state.login.code.length!==6;return}
  if(k.startsWith('aw.')){state.aw[k.slice(3)]=val;const A=state.aw,b=$('[data-act="awaysave"]'),c=$('[data-act="endsave"]');if(b)b.disabled=!(A.from&&A.to&&A.to>=A.from);if(c)c.disabled=!A.end;return}
  if(k.startsWith('ns.')){const N=state.newSite;N[k.slice(3)]=val;const b=$('[data-act="nssave"]');if(b)b.disabled=!(N.gym.trim()&&N.city.trim()&&N.st.trim());return}
  if(k==='email2'){me().email2=val.trim();return}
  if(k==='adminQ'){state.adminQ=val;render();const q=$('#adminQ');if(q){q.focus();q.setSelectionRange(val.length,val.length)}return}
  if(k==='walkin'){state.walkin=val;const b=$('[data-act="addwalk"]');if(b)b.disabled=!val.trim();return}
  if(k==='findSite'){state.findSite=val;render();return}
  if(k==='addName'){state.addName=val;render();return}
  if(k==='fby'){const F=state.filter;F.by=val;if(FKEY[val])F.v=fopts(val)[0];render();return}
  if(k==='fval'){state.filter.v=val;render();return}
  if(k==='fmonth'){state.fmonth=val;render();return}
  if(k in W){W[k]=val;if(e.target.type==='checkbox'||e.target.tagName==='SELECT')render();else{
      const b=$('[data-act="wstep"][data-v="2"]');if(b)b.disabled=!(W.type&&W.home&&W.ecName.trim()&&W.ecPhone.trim());
      const s=$('[data-act="sign"]');if(s)s.disabled=!(W.ack1&&W.ack2&&W.name.trim());}
    return}
  if(k.startsWith('d.')&&D){const f=k.slice(2);D[f]=e.target.type==='checkbox'?val:(f==='nth'||f==='mday'?+val:val);
    if(f==='name'){const b=$('[data-act="savesess"]');if(b)b.disabled=!val.trim();return}
    if(f==='nth'||f==='mday'||f==='date'||f==='tbc')D.skip=[];
    if(e.target.tagName==='SELECT'||e.target.type==='checkbox'||f==='date')render();}
});
document.addEventListener('change',e=>{const k=e.target.dataset&&e.target.dataset.bind;if(k==='d.date'||k==='d.cap'||k==='d.from'||k==='d.to')render()});
render();
</script>
