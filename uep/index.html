<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>UEP Climb Scheduler</title>
<meta name="theme-color" content="#1f5fa8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231f5fa8'/%3E%3Cpath d='M5 25l8-12 5 7 4-5 6 10z' fill='none' stroke='white' stroke-width='2.6' stroke-linejoin='round'/%3E%3Ccircle cx='22' cy='8' r='2.2' fill='white'/%3E%3C/svg%3E" type="image/svg+xml">
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* Layout: view switch on top (Prototype / Open questions); a phone-sized app (wide desk for admin) with notes beside it.
   Big type and 48px+ touch targets throughout: many users live with tremor or reduced dexterity. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --raised:#f6f8fa; --fg:#16222e; --muted:#566575; --line:#d3dbe3;
  --accent:#1f5fa8; --accent-fg:#ffffff; --accent-soft:#dde8f6;
  --sun:#9a6a00; --sun-bg:#fbefcf;
  --ok:#22693f; --ok-bg:#dbefe2; --warn:#8a5a00; --warn-bg:#f8ebc9; --bad:#a3283a; --bad-bg:#f7dde1;
  --bar1:#1f5fa8; --bar2:#8fb4de;
  --display:'Archivo','Helvetica Neue',Arial,sans-serif;
  --body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f171f; --surface:#17222d; --raised:#1d2a37; --fg:#e7edf3; --muted:#9cadbd; --line:#2d3c4b;
  --accent:#86b5ee; --accent-fg:#0c1927; --accent-soft:#203750;
  --sun:#f0c45e; --sun-bg:#3a2f14;
  --ok:#8fd1a6; --ok-bg:#183223; --warn:#efc36a; --warn-bg:#3a2f15; --bad:#f39aa7; --bad-bg:#3e1f27;
  --bar1:#86b5ee; --bar2:#3d5f86; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f171f; --surface:#17222d; --raised:#1d2a37; --fg:#e7edf3; --muted:#9cadbd; --line:#2d3c4b;
  --accent:#86b5ee; --accent-fg:#0c1927; --accent-soft:#203750;
  --sun:#f0c45e; --sun-bg:#3a2f14;
  --ok:#8fd1a6; --ok-bg:#183223; --warn:#efc36a; --warn-bg:#3a2f15; --bad:#f39aa7; --bad-bg:#3e1f27;
  --bar1:#86b5ee; --bar2:#3d5f86; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:17px/1.5 var(--body);padding-inline:16px;padding-block:20px 48px;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:800;line-height:1.15;margin:0;text-wrap:balance}
h2{font-size:22px} h3{font-size:17px;font-weight:600}
p{margin:0}
.wrap{max-width:1120px;margin-inline:auto;display:flex;flex-direction:column;gap:18px}

.top{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-end;justify-content:space-between}
.top h1{font-size:30px;letter-spacing:-.01em}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.tag{font-size:12px;letter-spacing:.06em;text-transform:uppercase;background:var(--sun-bg);color:var(--sun);padding:4px 10px;border-radius:99px;font-weight:700}
.top small{color:var(--muted);font-size:14px}

.views{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:5px;width:fit-content;max-width:100%;flex-wrap:wrap}
.views button{border:0;background:none;padding:10px 16px;border-radius:10px;font-weight:700;min-height:44px}
.views button[aria-selected="true"]{background:var(--accent);color:var(--accent-fg)}
.count{display:inline-block;min-width:22px;padding:0 6px;margin-left:6px;border-radius:99px;background:var(--sun-bg);color:var(--sun);font-size:13px;line-height:22px;text-align:center}
.views button[aria-selected="true"] .count{background:var(--accent-fg);color:var(--accent)}

.stage{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:28px;align-items:start}
.stage.wide{grid-template-columns:minmax(0,1fr)}
@media (max-width:860px){.stage{grid-template-columns:minmax(0,1fr)}}

.device{background:var(--surface);border:1px solid var(--line);border-radius:28px;overflow:hidden;display:flex;flex-direction:column;height:800px;max-height:calc(100vh - 120px);min-height:620px;position:relative;box-shadow:0 14px 40px rgba(16,34,52,.12)}
.stage.wide .device{border-radius:18px;height:auto;max-height:none;min-height:0}
@media (max-width:860px){.device{max-height:none;height:760px}}
.appbar{padding:14px 18px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.appbar .brand{display:flex;align-items:center;gap:10px}
.appbar .brand b{font-family:var(--display);font-size:19px;font-weight:800}
.mark{width:30px;height:30px;border-radius:9px;background:var(--accent);display:grid;place-items:center}
.mark svg{width:18px;height:18px}
.who{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:700;padding:6px 2px;font-size:14px}
.switch{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.switch button{border:0;background:var(--surface);padding:6px 10px;font-size:13px;font-weight:700;color:var(--muted)}
.switch button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
#screen{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:16px}
.stage.wide #screen{overflow:visible}
.tabbar{display:flex;border-top:1px solid var(--line);background:var(--raised)}
.stage.wide .tabbar{order:-1;border-top:0;border-bottom:1px solid var(--line)}
.tabbar button{flex:1;border:0;background:none;padding:14px 6px;font-size:15px;font-weight:700;color:var(--muted);min-height:52px}
.tabbar button[aria-current="page"]{color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
.stage.wide .tabbar button{flex:0 0 auto;padding-inline:20px}
.stage.wide .tabbar button[aria-current="page"]{box-shadow:inset 0 -3px 0 var(--accent)}

.card{background:var(--raised);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.muted{color:var(--muted);font-size:15px}
.small{font-size:14px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.btn{border:0;background:var(--accent);color:var(--accent-fg);padding:13px 18px;border-radius:12px;font-weight:700;text-align:center;min-height:50px}
.btn.ghost{background:transparent;color:var(--accent);border:2px solid var(--accent)}
.btn.quiet{background:var(--surface);color:var(--fg);border:1px solid var(--line)}
.btn.sm{padding:9px 14px;min-height:44px;font-size:15px;border-radius:10px}
.btn.full{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.pill{font-size:13px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pill.sun{background:var(--sun-bg);color:var(--sun)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.plain{background:var(--surface);color:var(--muted);border:1px solid var(--line)}
.notice{border-radius:12px;padding:12px 14px;font-size:15px;background:var(--warn-bg);border-left:5px solid var(--warn)}
.notice.ok{background:var(--ok-bg);border-color:var(--ok)}
.notice.info{background:var(--accent-soft);border-color:var(--accent)}
.notice b{display:block;margin-bottom:2px}
.hero{background:var(--accent);color:var(--accent-fg);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:10px}
.hero .big{font-family:var(--display);font-size:26px;font-weight:800;line-height:1.1}
.hero .btn{background:var(--accent-fg);color:var(--accent)}
.hero .btn.ghost{background:transparent;color:var(--accent-fg);border-color:var(--accent-fg)}

label.f{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:15px}
input[type=text],input[type=email],input[type=tel],input[type=time],input[type=number],input[type=date],textarea,select{font:inherit;font-weight:400;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;width:100%;min-height:50px}
textarea{min-height:80px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:9px 14px;font-size:15px;min-height:44px}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.check{display:flex;gap:12px;align-items:flex-start;font-size:16px;cursor:pointer}
.check input{margin-top:2px;width:26px;height:26px;accent-color:var(--accent);flex:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}
.waiver{max-height:190px;overflow-y:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:12px 14px;font-size:15px;display:flex;flex-direction:column;gap:8px}
.waiver b{font-family:var(--display);font-weight:600}
.steps{display:flex;gap:6px}
.steps i{flex:1;height:6px;border-radius:9px;background:var(--line)}
.steps i.on{background:var(--accent)}
.code{font-family:var(--display);letter-spacing:.4em;font-size:24px;text-align:center}

/* roster */
.roster{display:flex;flex-direction:column;gap:8px}
.person{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--surface);min-height:64px;width:100%;text-align:left}
.person[aria-pressed="true"]{background:var(--ok-bg);border-color:var(--ok)}
.tick{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;background:var(--surface)}
.person[aria-pressed="true"] .tick{background:var(--ok);border-color:var(--ok)}
.tick svg{width:20px;height:20px;opacity:0}
.person[aria-pressed="true"] .tick svg{opacity:1}
.person .nm{font-weight:700;font-size:17px}
.person .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.tally{font-family:var(--display);font-size:40px;font-weight:800;line-height:1}
.tally span{font-size:18px;color:var(--muted);font-weight:600}

/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--raised);display:flex;flex-direction:column;gap:4px}
.kpi .n{font-family:var(--display);font-size:32px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.kpi .l{font-size:14px;color:var(--muted)}
.kpi.flag{border-color:var(--warn);background:var(--warn-bg)}
.split{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
@media (max-width:860px){.split{grid-template-columns:minmax(0,1fr)}}
.scroll-x{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700}
td.num,th.num{text-align:right}
.meter{height:8px;border-radius:9px;background:var(--line);overflow:hidden;min-width:70px}
.meter i{display:block;height:100%;background:var(--ok)}
.meter.low i{background:var(--bad)}
.meter.mid i{background:var(--warn)}
.legend{display:flex;gap:14px;font-size:14px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
svg text{fill:var(--muted);font-family:var(--body);font-size:12px}

/* schedule builder */
.datechips{display:flex;flex-wrap:wrap;gap:8px}
.datechip{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-size:15px;min-height:44px}
.datechip[aria-pressed="true"]{text-decoration:line-through;color:var(--muted);background:var(--raised)}

/* notes and backlog */
.notes{display:flex;flex-direction:column;gap:14px;min-width:0}
.notes h2{font-size:24px}
.notes ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.try{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.try h3{margin-bottom:6px}
.foot{font-size:14px;color:var(--muted)}
.req{font-size:14px;color:var(--muted)}
.req b{color:var(--fg)}

.bl{display:flex;flex-direction:column;gap:18px}
.bl-head{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-end}
.bl-group{display:flex;flex-direction:column;gap:10px}
.bl-group h2{font-size:19px;padding-bottom:6px;border-bottom:2px solid var(--line)}
.q{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:4px 14px;align-items:start}
.q .id{font-family:var(--display);font-weight:600;color:var(--muted);font-size:15px;padding-top:2px}
.q .qt{font-weight:700;font-size:17px}
.q .why{color:var(--muted);font-size:15px;grid-column:2}
.q .ans{grid-column:2;font-size:15px;background:var(--ok-bg);border-radius:8px;padding:6px 10px}
.q .tags{display:flex;flex-direction:column;gap:6px;align-items:flex-end;grid-row:1 / span 3;grid-column:3}
@media (max-width:560px){.q{grid-template-columns:minmax(0,1fr)}.q .id,.q .why,.q .ans{grid-column:1}.q .tags{grid-column:1;grid-row:auto;flex-direction:row;flex-wrap:wrap;align-items:center}}

.toast{position:absolute;left:16px;right:16px;bottom:78px;background:var(--fg);color:var(--bg);padding:13px 16px;border-radius:12px;font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:5}
.stage.wide .toast{position:fixed;left:50%;right:auto;bottom:24px;transform:translateX(-50%);max-width:min(560px,calc(100vw - 32px))}
@media (prefers-reduced-motion:no-preference){.card,.hero,.q{animation:rise .2s ease-out}@keyframes rise{from{opacity:.5;transform:translateY(3px)}}}
</style>
<style>[hidden]{display:none!important} img{max-width:100%}</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="stack" style="gap:4px">
      <span class="eyebrow">Up ENDing Parkinson's</span>
      <h1>Climb Scheduler</h1>
    </div>
    <div><span class="tag">Clickable prototype</span> <small>Sample data only. Built by Positive Tribes.</small></div>
  </header>
  <div class="views" role="tablist" aria-label="Choose a view" id="views"></div>
  <div id="main"></div>
</div>

<script>
/* ---------- Dates and recurrence ---------- */
const DAY = 864e5;
const DOW = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const DOWS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const NTH = {1:'First',2:'Second',3:'Third',4:'Fourth','-1':'Last'};
const today = (()=>{const d=new Date();d.setHours(0,0,0,0);return d})();
const addDays=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const fromIso=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const fmt=d=>d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
const fmtLong=d=>d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
const weekStart=d=>addDays(d,-d.getDay());
function t12(t){if(!t)return'';let [h,m]=t.split(':').map(Number);const ap=h>=12?'pm':'am';h=h%12||12;return `${h}:${String(m).padStart(2,'0')}${ap}`}

function matches(r,d){
  if(r.skip&&r.skip.includes(iso(d)))return false;
  if(r.freq==='once')return iso(d)===r.date;
  if(r.freq==='weekly'){
    if(!r.days.includes(d.getDay()))return false;
    const weeks=Math.round((weekStart(d)-weekStart(fromIso(r.start)))/(7*DAY));
    return weeks>=0&&weeks%(r.interval||1)===0;
  }
  if(r.freq==='monthly'){
    if(d.getDay()!==r.day)return false;
    if(+r.nth===-1)return addDays(d,7).getMonth()!==d.getMonth();
    return Math.ceil(d.getDate()/7)===+r.nth;
  }
  return false;
}
function nextDates(r,n,from=today,includeSkipped=false){
  const out=[];const rr=includeSkipped?{...r,skip:[]}:r;
  for(let i=0;i<500&&out.length<n;i++){const d=addDays(from,i);if(matches(rr,d))out.push(d)}
  return out;
}
function ruleText(r){
  if(r.freq==='once')return 'One time, '+fmt(fromIso(r.date));
  if(r.freq==='monthly')return `${NTH[r.nth]} ${DOW[r.day]} of each month`;
  const ds=r.days.slice().sort().map(x=>DOW[x]);
  const list=ds.length>1?ds.slice(0,-1).join(', ')+' and '+ds.at(-1):ds[0];
  return (r.interval===2?'Every other ':'Every ')+list;
}

/* ---------- Sample data ---------- */
const SITES=[
  {id:'gol',city:'Golden, CO',gym:'Movement Golden',region:'Mountain',lead:'Pat Rivera',sessions:8,rec:7,booked:64,checked:51},
  {id:'tim',city:'Timonium, MD',gym:'Movement Timonium',region:'East',lead:'Lena Brooks',sessions:8,rec:8,booked:78,checked:69},
  {id:'col',city:'Columbia, MD',gym:'Movement Columbia',region:'East',lead:'Dana Lee',sessions:4,rec:1,booked:16,checked:3},
  {id:'bou',city:'Boulder, CO',gym:'Partner gym',region:'Mountain',lead:'Chris Ng',sessions:4,rec:3,booked:30,checked:22},
  {id:'pdx',city:'Portland, OR',gym:'Partner gym',region:'West',lead:'Robin Hale',sessions:8,rec:6,booked:44,checked:33},
  {id:'chi',city:'Chicago, IL',gym:'Partner gym',region:'Central',lead:'Sam Patel',sessions:4,rec:2,booked:22,checked:9},
  {id:'aus',city:'Austin, TX',gym:'Partner gym',region:'Central',lead:'Jordan Diaz',sessions:4,rec:0,booked:26,checked:0},
  {id:'ral',city:'Raleigh, NC',gym:'Partner gym',region:'East',lead:'Morgan Kim',sessions:4,rec:0,booked:12,checked:0}
];
const site=id=>SITES.find(s=>s.id===id);
const start0=iso(weekStart(addDays(today,-60)));
const S=(id,siteId,name,rule,from,to,cap,booked,tbc=false)=>({id,site:siteId,name,rule:{start:start0,skip:[],...rule},from,to,cap,booked,tbc});

const state={
  view:'proto', user:null, mode:null, tab:{}, toast:'',
  login:{step:1,email:'',code:'',sent:''},
  waiver:{step:1,ack1:false,ack2:false,name:'',proxy:false,proxyName:'',proxyRel:'Spouse or partner',dob:'',ecName:'',ecPhone:''},
  findSite:'gol',
  sessions:[
    S('s1','gol','Morning climb',{freq:'weekly',days:[3],interval:1},'10:00','11:30',14,11),
    S('s2','gol','Saturday climb',{freq:'weekly',days:[6],interval:1},'13:30','15:00',12,9),
    S('s3','gol','Outdoor day at Clear Creek',{freq:'monthly',nth:1,day:2},'09:00','13:00',10,6,true),
    S('s4','tim','Sunday climb',{freq:'weekly',days:[0],interval:1},'13:30','15:00',16,12),
    S('s5','tim','Wednesday climb',{freq:'weekly',days:[3],interval:1},'09:00','10:30',16,16),
    S('s6','col','Tuesday climb',{freq:'weekly',days:[2],interval:1},'10:00','11:30',10,4),
    S('s7','bou','Thursday climb',{freq:'weekly',days:[4],interval:2},'17:30','19:00',12,7)
  ],
  people:{
    'ruth@example.org':{name:'Ruth Alvarez',roles:['climber'],home:'gol',waiver:'2026-03-14',ec:'Luis Alvarez, (303) 555-0142',standing:['s1'],once:[],missed:[]},
    'sam@example.org':{name:'Sam Okoye',roles:['climber'],home:'gol',waiver:null,ec:'',standing:[],once:[],missed:[]},
    'pat@example.org':{name:'Pat Rivera',roles:['climber','lead'],lead:'gol',home:'gol',waiver:'2025-11-02',ec:'Ann Rivera, (720) 555-0177',standing:['s2'],once:[],missed:[]},
    'molly@example.org':{name:'Molly (sample admin)',roles:['admin'],home:null,waiver:null,standing:[],once:[],missed:[]}

function myUpcoming(p){
  const items=[];
  p.standing.forEach(id=>{const s=sess(id);nextDates(s.rule,3).forEach(d=>items.push({s,d,standing:true}))});
  p.once.forEach(o=>{const s=sess(o.id);items.push({s,d:fromIso(o.date),standing:false})});
  return items.filter(x=>x.d>=today).sort((a,b)=>a.d-b.d);
}

function newDraft(){return {name:'',freq:'weekly',days:[3],interval:1,nth:1,mday:2,date:iso(addDays(today,14)),from:'10:00',to:'11:30',cap:12,tbc:false,skip:[]}}
function draftRule(D){
  if(D.freq==='once')return {freq:'once',date:D.date,skip:[]};
  if(D.freq==='monthly')return {freq:'monthly',nth:D.nth,day:D.mday,skip:D.skip};
  const days=D.days.length?D.days:[3];let first=today;
  for(let i=0;i<7;i++){const d=addDays(today,i);if(days.includes(d.getDay())){first=d;break}}
  return {freq:'weekly',days,interval:D.interval,start:iso(first),skip:D.skip};
}

      ${D.freq==='once'?`<label class="f" for="ddate">Date<input type="date" id="ddate" data-bind="d.date" value="${esc(D.date)}"></label>`:''}
      <label class="check"><input type="checkbox" id="dtbc" data-bind="d.tbc" ${D.tbc?'checked':''}><span>Time to be confirmed</span></label>
      ${D.tbc?'':`<div class="grid2"><label class="f" for="dfrom">Starts<input type="time" id="dfrom" data-bind="d.from" value="${esc(D.from)}"></label><label class="f" for="dto">Ends<input type="time" id="dto" data-bind="d.to" value="${esc(D.to)}"></label></div>`}
      <label class="f" for="dcap">Spots<input type="number" id="dcap" min="1" max="60" data-bind="d.cap" value="${esc(D.cap)}"></label>
      <div class="notice info"><b>${esc(ruleText(r))}</b>${D.freq==='once'?'':'Tap a date to skip it, for a holiday or gym closure.'}</div>
      <div class="datechips">${prev.map(d=>`<button class="datechip" data-act="dskip" data-v="${iso(d)}" aria-pressed="${D.skip.includes(iso(d))}">${esc(fmt(d))}</button>`).join('')||'<span class="muted small">Pick at least one day.</span>'}</div>
      <div class="row"><button class="btn ghost" data-act="cancelsess">Cancel</button><button class="btn" style="flex:1" data-act="savesess" ${D.name.trim()&&prev.length?'':'disabled'}>Save session</button></div>
    </div>`;
  }
  html+=leadSessions().map(s=>`<div class="card">
    <div class="row"><h3>${esc(s.name)}</h3><span class="pill">${s.booked} / ${s.cap} booked</span></div>
    <div class="muted small">${esc(ruleText(s.rule))} · ${s.tbc?'Time to be confirmed':t12(s.from)+' to '+t12(s.to)}</div>
    <div class="small">Next: ${nextDates(s.rule,3).map(d=>esc(fmt(d))).join(' · ')}</div>
  </div>`).join('');
  return html;
}

/* ---------- Screens: admin ---------- */
function sitesView(){return state.siteFilter==='All'?SITES:SITES.filter(s=>s.region===state.siteFilter)}
function adminOverview(){
  const ss=sitesView();
  const sum=k=>ss.reduce((a,s)=>a+s[k],0);
  const booked=sum('booked'),checked=sum('checked'),sessions=sum('sessions'),rec=sum('rec');
  const dark=ss.filter(s=>s.rec/s.sessions<.5).length;
  const max=140,W=560,H=200,pad=34,bw=(W-pad-10)/WEEKS.length;
  const y=v=>H-24-(v/max)*(H-40);
  const bars=WEEKS.map(([b,c],i)=>{const x=pad+i*bw+bw*.16,w=bw*.32;return `<rect x="${x.toFixed(1)}" y="${y(b).toFixed(1)}" width="${w.toFixed(1)}" height="${(H-24-y(b)).toFixed(1)}" rx="3" fill="var(--bar2)"><title>Booked ${b}</title></rect><rect x="${(x+w+2).toFixed(1)}" y="${y(c).toFixed(1)}" width="${w.toFixed(1)}" height="${(H-24-y(c)).toFixed(1)}" rx="3" fill="var(--bar1)"><title>Checked in ${c}</title></rect><text x="${(x+w).toFixed(1)}" y="${H-6}" text-anchor="middle">${esc(fmt(addDays(weekStart(today),-(7*(WEEKS.length-1-i)))).replace(/^\w+, /,''))}</text>`}).join('');
  const grid=[0,35,70,105,140].map(v=>`<line x1="${pad}" x2="${W-6}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pad-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`).join('');
  return `<div class="row"><div><h2>All sites, last 4 weeks</h2><p class="muted">Showing ${ss.length} of 84 sites (sample data).</p></div>
    <div class="chips">${['All','East','Central','Mountain','West'].map(r=>`<button class="chip" data-act="region" data-v="${r}" aria-pressed="${state.siteFilter===r}">${r}</button>`).join('')}</div></div>
  <div class="kpis">
    <div class="kpi"><span class="n">${booked}</span><span class="l">Bookings</span></div>
    <div class="kpi"><span class="n">${checked}</span><span class="l">Check-ins recorded</span></div>
    <div class="kpi"><span class="n">${Math.round(rec/sessions*100)}%</span><span class="l">Sessions with attendance taken</span></div>
    <div class="kpi ${dark?'flag':''}"><span class="n">${dark}</span><span class="l">Sites rarely taking attendance</span></div>
  </div>
  <div class="split">
    <div class="card"><div class="row"><h3>Weekly bookings and check-ins</h3><div class="legend"><span><i style="background:var(--bar2)"></i>Booked</span><span><i style="background:var(--bar1)"></i>Checked in</span></div></div>
      <div class="scroll-x"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Bar chart of weekly bookings and check-ins across all sites, last 8 weeks" style="width:100%;min-width:460px;height:auto">${grid}${bars}</svg></div>
      <p class="muted small">All 84 sites combined, sample figures. Check-ins trail bookings partly because some sites don't record attendance.</p></div>
    <div class="card"><h3>Climbers drifting away</h3><p class="muted small">Had a weekly habit, no visit in 3+ weeks.</p>
      ${state.drift.map((d,i)=>`<div class="row" style="border-top:1px solid var(--line);padding-top:8px"><div style="min-width:0"><b>${esc(d.n)}</b><div class="muted small">${esc(site(d.site).city)} · last came ${esc(d.last)}</div></div>
        ${state.nudged.has(i)?'<span class="pill ok">Note sent</span>':`<button class="btn quiet sm" data-act="nudge" data-v="${i}">Send a note</button>`}</div>`).join('')}</div>
  </div>
  <div class="card"><h3>By site</h3>
    <div class="scroll-x"><table><thead><tr><th>Site</th><th>Lead</th><th class="num">Sessions</th><th class="num">Booked</th><th class="num">Checked in</th><th>Attendance taken</th><th></th></tr></thead><tbody>
    ${ss.map(s=>{const pct=s.rec/s.sessions,cls=pct<.5?'low':pct<.8?'mid':'';
      return `<tr><td><b>${esc(s.city)}</b><div class="muted small">${esc(s.gym)}</div></td><td>${esc(s.lead)}</td><td class="num">${s.sessions}</td><td class="num">${s.booked}</td><td class="num">${s.checked}</td>
      <td><div class="row" style="flex-wrap:nowrap"><div class="meter ${cls}" style="flex:1"><i style="width:${Math.round(pct*100)}%"></i></div><span class="small" style="width:48px;text-align:right">${s.rec} of ${s.sessions}</span></div></td>
      <td>${pct<.5?'<span class="pill bad">Follow up</span>':pct<.8?'<span class="pill warn">Patchy</span>':'<span class="pill ok">Good</span>'}</td></tr>`}).join('')}
    </tbody></table></div></div>`;
}
function adminSites(){
  return `<h2>Sites</h2><p class="muted">One list for every site. In Gymdesk each of these is a separate account and login.</p>
  <div class="kpis">${SITES.map(s=>`<div class="kpi"><b>${esc(s.city)}</b><span class="l">${esc(s.gym)}</span><span class="small">Lead: ${esc(s.lead)}</span><span class="small">${state.sessions.filter(x=>x.site===s.id).length||'No'} recurring sessions</span></div>`).join('')}</div>
  <p class="muted small">Adding a site, assigning its lead and copying a schedule template are planned for the full build.</p>`;
}

/* ---------- Notes beside the app ---------- */
const NOTES={
  out:{h:'One sign-in, no role picker',p:'Climbers, site leads and staff all sign in the same way. The system looks up the account and opens the right view.',
    b:['A code by email or text replaces passwords, which are hard to type with tremor and easy to forget.','Someone with two roles, like a lead who also climbs, gets one account with a simple switch.','A site lead only sees their own site.'],
    t:'Sign in as Sam, the new climber, to see the waiver step. Then sign out and try Pat, the site lead.',r:'Requirement 1'},
  climber:{h:'Book once, stay booked',p:'Today climbers book week by week, so future sessions look empty and people drop off when they forget. Here a climber picks a regular session once and stays booked.',
    b:['A reminder goes out the day before, with one tap to free the spot.','Climbers can book at other sites without a second membership.','The waiver is signed once with a checkbox and typed name, no drawing.','Large text and big tap targets throughout.'],
    t:'Tap "I can\'t make it this time" on the next climb, then open Find a session and book a one-time visit at another site.',r:'Requirements 2, 5, 6 and 8'},
  lead:{h:'Check-in in under a minute',p:'Many sites skip attendance today, so nobody knows who actually climbed. Check-in is a tap per person on the lead\'s phone.',
    b:['The roster is ready before the session starts, because bookings are standing.','Unsigned waivers are flagged at the door.','Walk-ins are added in one step.','Schedules support every other week, first Tuesday of the month, and skipped dates.'],
    t:'Check in a few people and save. Then open Schedule, create a session on the first Tuesday of each month, and skip one date.',r:'Requirements 3, 6 and 7'},
  admin:{h:'Every site in one view',p:'Molly sees bookings and attendance across all sites without logging into 84 accounts, and can spot which sites aren\'t taking attendance.',
    b:['Filter by region.','Sites that rarely record attendance are flagged for follow-up.','Climbers who stopped coming are listed so someone can reach out.','Exports for board and funder reports come in the full build.'],
    t:'Filter to East, then send a note to a climber who has drifted away.',r:'Requirements 2 and 3'}
};

/* ---------- Render ---------- */
function role(){
  if(!state.user)return 'out';
  const p=me();
  if(p.roles.includes('admin'))return 'admin';
  if(!p.waiver)return 'waiver';
  if(p.roles.includes('lead'))return state.mode||'lead';
  return 'climber';
}
const TABS={climber:[['home','Home'],['find','Find a session'],['me','My details']],lead:[['checkin','Check-in'],['schedule','Schedule']],admin:[['overview','Overview'],['sites','Sites']]};
function render(){
  const openQ=BACKLOG.filter(b=>b.status!=='Answered').length;
  $('#views').innerHTML=`<button role="tab" aria-selected="${state.view==='proto'}" data-act="view" data-v="proto">Prototype</button><button role="tab" aria-selected="${state.view==='backlog'}" data-act="view" data-v="backlog">Open questions<span class="count">${openQ}</span></button>`;
  if(state.view==='backlog'){$('#main').innerHTML=backlog();return}
  const r=role(),p=state.user?me():null,wide=r==='admin';
  let body='',tabs='';
  if(r==='out')body=signIn();
  else if(r==='waiver')body=waiverFlow();
  else{
    const T=TABS[r],cur=state.tab[r]||T[0][0];
    tabs=`<nav class="tabbar" aria-label="App sections">${T.map(([id,l])=>`<button data-act="tab" data-v="${id}" ${id===cur?'aria-current="page"':''}>${l}</button>`).join('')}</nav>`;
    if(r==='climber')body=cur==='home'?climberHome():cur==='find'?climberFind():climberProfile();
    if(r==='lead')body=cur==='checkin'?leadCheckin():leadSchedule();
    if(r==='admin')body=cur==='overview'?adminOverview():adminSites();
  }
  const sw=p&&p.roles.includes('lead')&&p.waiver?`<div class="switch" role="group" aria-label="Switch view"><button data-act="mode" data-v="climber" aria-pressed="${r==='climber'}">My climbing</button><button data-act="mode" data-v="lead" aria-pressed="${r==='lead'}">My site</button></div>`:'';
  const n=NOTES[r==='waiver'?'climber':r];
  const notes=wide?'':`<aside class="notes"><span class="req">${esc(n.r)}</span><h2>${esc(n.h)}</h2><p>${esc(n.p)}</p><ul>${n.b.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><div class="try"><h3>Try this</h3><p>${esc(n.t)}</p></div><p class="foot">Everything is sample data. Changes carry across accounts while the page is open, so a check-in shows up for the admin. Reload to reset.</p></aside>`;
  const sc=$('#screen'),top=sc?sc.scrollTop:0;
  $('#main').innerHTML=`<div class="stage ${wide?'wide':''}">
    <div class="device" id="device">
      <div class="appbar"><div class="brand"><span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="var(--accent-fg)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20l6-9 4 5 3-4 5 8z"/><circle cx="16" cy="5" r="1.6"/></svg></span><b>UEP Climb</b></div>
        <div class="who">${sw}${p?`<span>${esc(p.name)}</span><button class="linkbtn" data-act="signout">Sign out</button>`:'<span>Signed out</span>'}</div></div>
      <div id="screen">${body}</div>${tabs}
    </div>${notes}</div>`;
  const ns=$('#screen');if(ns&&!wide)ns.scrollTop=top;
  if(state.toast){const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=state.toast;$('#device').appendChild(t)}
}
function backlog(){
  const f=state.blFilter,items=BACKLOG.filter(b=>f==='All'||(f==='POC'?b.poc:b.owner===f));
  const owners=['All','POC','Molly','UEP counsel','Eric and Molly'];
  const areas=[...new Set(BACKLOG.map(b=>b.area))];
  const cnt=s=>BACKLOG.filter(b=>b.status===s).length;
  return `<div class="bl">
    <div class="bl-head"><div class="stack" style="gap:6px"><h2 style="font-size:26px">Open questions</h2>
      <p class="muted">What we still need to learn before the full build. ${cnt('Open')} open, ${cnt('Likely')} likely but unconfirmed. Questions marked "Shapes POC" change how the prototype works.</p>
      <p class="small">This is a snapshot. Answer questions and suggest changes in the <a href="https://uep.positivetribes.org/" target="_blank" rel="noopener" style="color:var(--accent);font-weight:700">shared backlog</a> (passcode needed).</p></div>
      <div class="chips" role="group" aria-label="Filter questions">${owners.map(o=>`<button class="chip" data-act="blf" data-v="${o}" aria-pressed="${f===o}">${o==='POC'?'Shapes POC':o==='All'?'All':'For '+o}</button>`).join('')}</div></div>
    ${areas.map(a=>{const g=items.filter(b=>b.area===a);if(!g.length)return '';return `<section class="bl-group"><h2>${esc(a)}</h2>${g.map(b=>`<div class="q">
      <span class="id">${b.id}</span><span class="qt">${esc(b.q)}</span>
      <span class="tags"><span class="pill ${b.status==='Likely'?'sun':b.status==='Answered'?'ok':'plain'}">${b.status==='Likely'?'Likely, confirm':b.status}</span><span class="small muted">${esc(b.owner)}</span>${b.poc?'<span class="pill">Shapes POC</span>':''}</span>
      <span class="why">${esc(b.why)}</span>${b.ans?`<span class="ans">${esc(b.ans)}</span>`:''}
    </div>`).join('')}</section>`}).join('')}
    <p class="foot">Last updated ${esc(fmtLong(today))}. Answers go here as they come in.</p></div>`;
}

/* ---------- Actions ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,v=el.dataset.v,L=state.login,W=state.waiver;
  if(a==='view')state.view=v;
  else if(a==='fill'){L.email=v;L.step=2;L.sent=v;L.code='123456'}
  else if(a==='sendcode'){L.sent=L.email.trim();L.step=2;L.code='123456'}
  else if(a==='back1'){L.step=1;L.code=''}
  else if(a==='verify'){
    const k=L.sent.toLowerCase();
    if(!state.people[k]){state.people[k]={name:k.split('@')[0].replace(/[._]/g,' ').replace(/\b\w/g,c=>c.toUpperCase()),roles:['climber'],home:'gol',waiver:null,ec:'',standing:[],once:[],missed:[]}}
    state.user=k;state.mode=null;L.step=1;L.email='';L.code='';
    state.waiver={step:1,ack1:false,ack2:false,name:'',proxy:false,proxyName:'',proxyRel:'Spouse or partner',dob:'',ecName:'',ecPhone:''};
    state.findSite=me().home||'gol';
    const r=role();say(r==='admin'?'Signed in. You have admin access to every site.':r==='lead'?'Signed in. You lead the Golden site and also climb there.':r==='waiver'?'Signed in. One quick step before your first climb.':'Signed in.');
  }
  else if(a==='signout'){state.user=null;state.mode=null;state.tab={};state.draft=null}
  else if(a==='mode'){state.mode=v}
  else if(a==='tab'){state.tab[role()]=v}
  else if(a==='wstep')W.step=+v;
  else if(a==='sign'){const p=me();p.waiver=iso(today);p.ec=`${W.ecName}, ${W.ecPhone}`;say('Waiver signed. You can book any session now.');state.tab.climber='find'}
  else if(a==='miss'){me().missed.push(v);say('Got it. Your spot is free for someone on the waitlist.')}
  else if(a==='undomiss'){const p=me();p.missed=p.missed.filter(x=>x!==v);say('Great, you\'re back on the list.')}
  else if(a==='stand'){const p=me(),s=sess(v);p.standing.push(v);s.booked++;say(`Booked every week: ${ruleText(s.rule)}.`)}
  else if(a==='once'){const p=me(),s=sess(v);p.once.push({id:v,date:iso(nextOf(s))});s.booked++;say('Booked for '+fmt(nextOf(s))+'.')}
  else if(a==='unstand'){const p=me(),s=sess(v);p.standing=p.standing.filter(x=>x!==v);s.booked=Math.max(0,s.booked-1);say('Weekly booking stopped.')}
  else if(a==='waitlist'){say('You\'re on the waitlist. We\'ll text you if a spot opens.')}
  else if(a==='toggle'){const i=+v;state.checked.has(i)?state.checked.delete(i):state.checked.add(i);state.rosterDone=false}
  else if(a==='addwalk'){state.roster.push({n:state.walkin.trim(),w:false,cp:false,walk:true});state.checked.add(state.roster.length-1);state.walkin='';state.rosterDone=false}
  else if(a==='finish'){
    const g=site('gol');if(!state.rosterDone){g.rec=Math.min(g.sessions,g.rec+1);g.checked+=state.checked.size}
    state.rosterDone=true;say('Attendance saved. Molly\'s dashboard now includes it.');
  }
  else if(a==='newsess')state.draft=newDraft();
  else if(a==='cancelsess')state.draft=null;
  else if(a==='dfreq'){const D=state.draft;D.skip=[];if(v==='biweekly'){D.freq='weekly';D.interval=2}else if(v==='weekly'){D.freq='weekly';D.interval=1}else D.freq=v}
  else if(a==='dday'){const D=state.draft,i=+v;D.days=D.days.includes(i)?D.days.filter(x=>x!==i):[...D.days,i];D.skip=[]}
  else if(a==='dskip'){const D=state.draft;D.skip=D.skip.includes(v)?D.skip.filter(x=>x!==v):[...D.skip,v]}
  else if(a==='savesess'){const D=state.draft;state.sessions.push({id:'n'+Date.now(),site:me().lead,name:D.name.trim(),rule:draftRule(D),from:D.from,to:D.to,cap:+D.cap||12,booked:0,tbc:D.tbc});state.draft=null;say('Session saved. Climbers can book it now.')}
  else if(a==='region')state.siteFilter=v;
  else if(a==='nudge'){state.nudged.add(+v);say('Note sent: "We miss you at climbing. Want to come back this week?"')}
  else if(a==='blf')state.blFilter=v;
  render();
  if(['view','tab','verify','signout','mode','wstep','sign','fill','sendcode'].includes(a)){const s=$('#screen');if(s)s.scrollTop=0;if(a==='view')window.scrollTo(0,0)}
});
document.addEventListener('input',e=>{
  const k=e.target.dataset&&e.target.dataset.bind;if(!k)return;
  const val=e.target.type==='checkbox'?e.target.checked:e.target.value,W=state.waiver,D=state.draft;
  if(k==='email'){state.login.email=val;const b=$('[data-act="sendcode"]');if(b)b.disabled=!val.trim();return}
  if(k==='code'){state.login.code=val.replace(/\D/g,'').slice(0,6);const b=$('[data-act="verify"]');if(b)b.disabled=state.login.code.length!==6;return}
  if(k==='walkin'){state.walkin=val;const b=$('[data-act="addwalk"]');if(b)b.disabled=!val.trim();return}
  if(k==='findSite'){state.findSite=val;render();return}
  if(k==='home'){me().home=val;return}
  if(k in W){W[k]=val;if(e.target.type==='checkbox'||e.target.tagName==='SELECT')render();else{
      const b=$('[data-act="wstep"][data-v="2"]');if(b)b.disabled=!(W.ecName.trim()&&W.ecPhone.trim());
      const s=$('[data-act="sign"]');if(s)s.disabled=!(W.ack1&&W.ack2&&W.name.trim()&&(!W.proxy||W.proxyName.trim()));}
    return}
  if(k.startsWith('d.')&&D){const f=k.slice(2);D[f]=e.target.type==='checkbox'?val:(f==='nth'||f==='mday'?+val:val);
    if(f==='name'){const b=$('[data-act="savesess"]');if(b)b.disabled=!val.trim();return}
    if(f==='nth'||f==='mday'||f==='date'||f==='tbc')D.skip=[];
    if(e.target.tagName==='SELECT'||e.target.type==='checkbox'||f==='date')render();}
});
document.addEventListener('change',e=>{const k=e.target.dataset&&e.target.dataset.bind;if(k==='d.date'||k==='d.cap'||k==='d.from'||k==='d.to')render()});
render();
</script>
