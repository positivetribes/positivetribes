<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Command Center | Positive Tribes</title><link rel="icon" href="/brand/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/fonts/fonts.css"><style>
:root{--bg:#f7f6ef;--card:#fffdf8;--soft:#e9eddf;--ink:#243f36;--muted:#59665e;--line:#d9dfd4;--rust:#a94c32;--warn:#8a5a00;--warn-bg:#fbf0d9;--ok:#2f6b4f;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141b18;--card:#1b2420;--soft:#22302a;--ink:#e6ebe3;--muted:#a3b0a8;--line:#33423b;--rust:#e08a6d;--warn:#f0c46b;--warn-bg:#3a2f17;--ok:#7cc4a0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141b18;--card:#1b2420;--soft:#22302a;--ink:#e6ebe3;--muted:#a3b0a8;--line:#33423b;--rust:#e08a6d;--warn:#f0c46b;--warn-bg:#3a2f17;--ok:#7cc4a0;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 'DM Sans',Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--rust);outline-offset:2px}
.wrap{width:min(1240px,calc(100% - 32px));margin:auto}
header{display:flex;align-items:center;gap:18px;padding:18px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:'Fraunces',Georgia,serif;font-size:20px;text-decoration:none}.brand svg{width:30px;height:30px}.brand circle{fill:currentColor}.brand .core{fill:var(--rust)}
nav{display:flex;gap:4px}nav a{text-decoration:none;padding:7px 12px;border-radius:6px;font-size:14px}nav a[aria-current]{background:var(--soft);font-weight:600}
.status{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:13px;color:var(--muted);flex-wrap:wrap}
button,.button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:6px 11px;cursor:pointer;text-decoration:none;display:inline-block}button:hover,.button:hover{border-color:var(--ink)}button.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}button.link{border:0;background:none;padding:2px 4px;color:var(--muted);text-decoration:underline}
h1,h2,h3{font-family:'Fraunces',Georgia,serif;font-weight:400;line-height:1.15;margin:0}h1{font-size:clamp(28px,4vw,40px)}h2{font-size:20px;margin-bottom:12px}h3{font-size:16px;font-family:'DM Sans',Arial,sans-serif;font-weight:700}
main{padding:28px 0 80px}.muted{color:var(--muted)}.small{font-size:13px}
.banner{padding:10px 14px;border-radius:6px;background:var(--warn-bg);color:var(--warn);margin-bottom:18px;font-size:14px}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;align-items:start}
.panel{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:18px}
.count{font-family:'DM Sans',Arial,sans-serif;font-size:13px;color:var(--muted);margin-left:6px}
ul.items{list-style:none;margin:0;padding:0}ul.items li{padding:10px 0;border-top:1px solid var(--line)}ul.items li:first-child{border-top:0;padding-top:0}
.day{font-size:12px;text-transform:uppercase;letter-spacing:1.2px;color:var(--rust);font-weight:700;margin:16px 0 4px}.day:first-child{margin-top:0}
.row{display:flex;gap:4px 8px;align-items:baseline;flex-wrap:wrap}.row .grow{flex:1 1 200px;min-width:0}
.title{overflow-wrap:anywhere}.title a{text-decoration:none}.title a:hover{text-decoration:underline}
.meta{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.chip{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;padding:2px 7px;border-radius:20px;background:var(--soft);color:var(--muted);max-width:100%}
.chip.warn{background:var(--warn-bg);color:var(--warn)}.chip.claude{background:none;border:1px dashed var(--muted)}
.client-link{color:var(--rust);text-decoration:none;font-weight:600;font-size:12.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:18px;display:flex;flex-direction:column;gap:10px;text-decoration:none}.card:hover{border-color:var(--ink)}
.card.inactive{opacity:.7}.stages{display:flex;flex-wrap:wrap;gap:6px}
.detail{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:22px;align-items:start}.detail aside{display:grid;gap:18px}
.now{display:flex;align-items:center;gap:10px;color:var(--rust);font-weight:700;font-size:12px;letter-spacing:1.2px;text-transform:uppercase;margin:18px 0}.now:before,.now:after{content:"";flex:1;height:2px;background:var(--rust)}
form.inline{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}form.inline input[type=text],form.inline textarea{flex:1 1 180px}
input,textarea{font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0}textarea{width:100%;min-height:64px;resize:vertical}
label.check{display:flex;gap:8px;align-items:flex-start;cursor:pointer}label.check input{margin-top:4px}
details summary{cursor:pointer;font-weight:600}details[open] summary{margin-bottom:10px}
.empty{color:var(--muted);font-size:14px;font-style:italic}
.err{color:var(--rust);font-size:13px;min-height:1em}
.head{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;margin-bottom:22px}.head .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
@media(max-width:1000px){.cols,.detail{grid-template-columns:minmax(0,1fr)}}
@media(max-width:600px){.status{margin-left:0;width:100%}}
</style></head><body><div class="wrap">
<header><a class="brand" href="#/"><svg viewBox="0 0 152 152" aria-hidden="true"><circle cx="76" cy="22" r="22"/><circle cx="130" cy="76" r="22"/><circle cx="76" cy="130" r="22"/><circle cx="22" cy="76" r="22"/><circle class="core" cx="76" cy="76" r="22"/></svg><span>Command Center</span></a>
<nav aria-label="Views"><a href="#/" data-nav="today">Today</a><a href="#/clients" data-nav="clients">Clients</a></nav>
<div class="status"><span id="sync"></span><button id="refresh" type="button">Refresh</button></div></header>
<main id="main" aria-live="polite"><p class="muted">Loading…</p></main></div>
<script>
const $main = document.getElementById('main');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const safeUrl = u => /^https?:\/\//i.test(u || '') ? u : '';
const TYPE = { meeting: 'Meeting', calendar: 'Calendar', email: 'Email', task: 'Task', case: 'Case', step: 'Next step', note: 'Note', close: 'Close date', stage: 'Stage', lead: 'Lead', stale: 'Quiet' };
let overview = null;

async function api(path, options = {}) {
  const response = await fetch('/api/admin' + path, { ...options, headers: options.body ? { 'Content-Type': 'application/json' } : {}, credentials: 'same-origin' });
  const data = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(data.error || (response.status === 403 ? 'Your sign-in expired. Reload the page.' : 'Something went wrong.'));
  return data;
}
const send = (path, method, data) => api(path, { method, body: JSON.stringify(data) });

const dayName = day => {
  if (!day) return '';
  const today = overview?.today || new Date().toISOString().slice(0, 10);
  const diff = Math.round((Date.parse(day) - Date.parse(today)) / 86400e3);
  if (diff === 0) return 'Today';
  if (diff === 1) return 'Tomorrow';
  if (diff === -1) return 'Yesterday';
  return new Date(day + 'T12:00:00Z').toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric', timeZone: 'UTC' });
};
const timeOf = at => at && at.length > 10 ? new Date(at).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit', timeZone: 'America/Denver' }) : '';
const ago = day => {
  if (!day) return 'never';
  const days = Math.round((Date.parse(overview?.today || day) - Date.parse(day)) / 86400e3);
  return days <= 0 ? 'today' : days === 1 ? 'yesterday' : days + ' days ago';
};

function item(i, { showClient = true, showDay = false, controls = null } = {}) {
  const url = safeUrl(i.url);
  const title = i.type === 'stale' ? `<a href="#/client/${esc(i.accountId)}">${esc(i.title)}</a>` : url ? `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(i.title)}</a>` : esc(i.title);
  const client = showClient && i.accountId && i.client ? `<a class="client-link" href="#/client/${esc(i.accountId)}">${esc(i.client)}</a>` : '';
  const when = i.type === 'stale' ? (i.day ? 'Last contact ' + ago(i.day) : '') : [showDay ? dayName(i.day) : '', timeOf(i.at)].filter(Boolean).join(', ');
  const chip = i.reason ? `<span class="chip warn">${esc(i.reason)}</span>` : `<span class="chip${i.source === 'claude' ? ' claude' : ''}">${esc(TYPE[i.type] || i.type)}${i.source === 'claude' ? ' · suggested' : ''}</span>`;
  return `<li><div class="row"><div class="grow"><div class="title">${title}</div>
    <div class="meta">${[client, when ? esc(when) : '', i.detail ? esc(i.detail) : ''].filter(Boolean).join(' · ')}</div></div>${chip}</div>${controls ? controls(i) : ''}</li>`;
}
function byDay(items, opts) {
  if (!items.length) return '<p class="empty">Nothing here.</p>';
  let html = '', last = null;
  for (const i of items) {
    if (i.day !== last) { if (last !== null) html += '</ul>'; html += `<div class="day">${esc(dayName(i.day))}</div><ul class="items">`; last = i.day; }
    html += item(i, opts);
  }
  return html + '</ul>';
}

function syncStatus(lastSync) {
  const el = document.getElementById('sync');
  if (!lastSync) { el.textContent = 'Activity sync has not run yet'; return; }
  const hours = (Date.now() - Date.parse(lastSync.ran_at)) / 3600e3;
  el.textContent = 'Synced ' + (hours < 1 ? 'within the hour' : hours < 36 ? Math.round(hours) + ' h ago' : Math.round(hours / 24) + ' days ago');
  el.style.color = hours > 36 ? 'var(--warn)' : '';
}
function banners(data) {
  let html = '';
  if (data.salesforce === 'error') html += '<div class="banner">Salesforce could not be reached, so only your notes, steps and synced activity are shown. Try Refresh in a minute.</div>';
  if (data.salesforce === 'off') html += '<div class="banner">Salesforce is not connected on this deployment, so no clients are listed.</div>';
  if (data.lastSync && Date.now() - Date.parse(data.lastSync.ran_at) > 36 * 3600e3) html += '<div class="banner">The daily activity sync has not run in over 36 hours. Check the Claude routine.</div>';
  return html;
}

async function loadOverview(refresh) {
  overview = await api('/overview' + (refresh ? '?refresh=1' : ''));
  syncStatus(overview.lastSync);
  return overview;
}

function renderToday(data) {
  const attention = data.attention.slice().sort((a, b) => (a.day || '').localeCompare(b.day || ''));
  $main.innerHTML = `${banners(data)}<div class="head"><div><p class="muted small">${esc(new Date(data.today + 'T12:00:00Z').toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric', timeZone: 'UTC' }))}</p><h1>Good ${new Date().getHours() < 12 ? 'morning' : new Date().getHours() < 17 ? 'afternoon' : 'evening'}</h1></div></div>
  <div class="cols">
    <section class="panel"><h2>Needs attention<span class="count">${attention.length}</span></h2>${attention.length ? `<ul class="items">${attention.map(i => item(i, { showDay: !!i.day && i.type !== 'stale', showClient: i.type !== 'stale' })).join('')}</ul>` : '<p class="empty">All clear.</p>'}</section>
    <section class="panel"><h2>Coming up<span class="count">next 14 days</span></h2>${byDay(data.upcoming)}</section>
    <section class="panel"><h2>Recent<span class="count">last 14 days</span></h2>${byDay(data.recent)}</section>
  </div>`;
}

function renderClients(data) {
  const cards = data.clients.map(c => {
    const stages = c.opportunities.filter(o => o.open).map(o => `<span class="chip" title="${esc(o.name)}">${esc(o.stage)}</span>`).join('') || '<span class="muted small">No open opportunities</span>';
    const next = c.nextStep ? `${esc(c.nextStep.title)}${c.nextStep.dueDate ? ` <span class="muted">· ${esc(dayName(c.nextStep.dueDate))}</span>` : ''}` : (c.opportunities.find(o => o.open && o.nextStep)?.nextStep ? esc(c.opportunities.find(o => o.open && o.nextStep).nextStep) : '<span class="muted">No next step</span>');
    return `<a class="card${c.active ? '' : ' inactive'}" href="#/client/${esc(c.id)}"><div class="row"><h2 class="grow" style="margin:0">${esc(c.name)}</h2>${c.pinned ? '<span class="chip">Pinned</span>' : ''}</div>
      <div class="stages">${stages}</div>
      <div class="small"><strong>Next:</strong> ${next}</div>
      <div class="meta">Last contact ${esc(ago(c.lastTouch))}${c.type ? ' · ' + esc(c.type) : ''}${c.openSteps > 1 ? ` · ${c.openSteps} open steps` : ''}</div></a>`;
  }).join('');
  $main.innerHTML = `${banners(data)}<div class="head"><h1>Clients</h1><p class="muted small">${data.clients.filter(c => c.active).length} active of ${data.clients.length}</p></div><div class="grid">${cards || '<p class="empty">No clients yet.</p>'}</div>`;
}

const lines = v => v.split('\n').map(s => s.trim()).filter(Boolean);
function renderClient(data) {
  const c = data.client;
  const stepRow = s => `<li><div class="row"><label class="check grow"><input type="checkbox" data-step-done="${s.id}"><span><span class="title">${esc(s.title)}</span>${s.dueDate ? `<span class="meta"> · ${esc(dayName(s.dueDate))}</span>` : ''}</span></label>
    ${s.source === 'claude' ? `<span class="chip claude">Suggested</span>` : ''}</div>
    <div class="small">${s.source === 'claude' ? `<button class="link" data-step-keep="${s.id}">Keep</button>` : ''}<button class="link" data-step-dismiss="${s.id}">${s.source === 'claude' ? 'Dismiss' : 'Remove'}</button></div></li>`;
  const opps = c.opportunities.map(o => `<li><div class="row"><div class="grow"><div class="title"><a href="${esc(safeUrl(o.url))}" target="_blank" rel="noopener">${esc(o.name)}</a></div><div class="meta">${o.open ? 'Target ' + esc(dayName(o.closeDate)) : o.won ? 'Won' : 'Closed'}${o.nextStep ? ' · Next: ' + esc(o.nextStep) : ''}</div></div><span class="chip">${esc(o.stage)}</span></div></li>`).join('');
  const contacts = c.contacts.map(p => `<li><div class="title"><a href="${esc(safeUrl(p.url))}" target="_blank" rel="noopener">${esc(p.name)}</a>${p.title ? ` <span class="muted small">${esc(p.title)}</span>` : ''}</div><div class="meta">${p.email ? `<a href="mailto:${esc(p.email)}">${esc(p.email)}</a>` : ''}${p.phone ? ' · ' + esc(p.phone) : ''}</div></li>`).join('');
  const links = c.links.map(l => `<li><a href="${esc(safeUrl(l.url))}" target="_blank" rel="noopener">${esc(l.label)}</a></li>`).join('');
  const noteControls = i => i.type === 'note' ? `<div class="small"><button class="link" data-note-delete="${i.id}">Delete</button></div>` : '';
  const timeline = (list, empty) => list.length ? byDay(list, { showClient: false, controls: noteControls }) : `<p class="empty">${empty}</p>`;
  $main.innerHTML = `<div class="head"><div><p class="small"><a href="#/clients" class="client-link">← All clients</a></p><h1>${esc(c.name)}</h1><p class="muted small">${[c.type, c.website ? `<a href="${esc(safeUrl(/^https?:/i.test(c.website) ? c.website : 'https://' + c.website))}" target="_blank" rel="noopener">${esc(c.website)}</a>` : ''].filter(Boolean).join(' · ')}</p></div>
    <div class="actions"><button type="button" id="pin">${c.pinned ? 'Unpin' : 'Pin to top'}</button><a class="button" href="${esc(safeUrl(c.url))}" target="_blank" rel="noopener">Open in Salesforce ↗</a></div></div>
  <div class="detail"><aside>
    <section class="panel"><h2>Next steps<span class="count">${data.steps.length}</span></h2>${data.steps.length ? `<ul class="items">${data.steps.map(stepRow).join('')}</ul>` : '<p class="empty">No open steps.</p>'}
      <form class="inline" id="add-step"><input type="text" name="title" placeholder="Add a next step" maxlength="300" required aria-label="Next step"><input type="date" name="dueDate" aria-label="Due date"><button class="primary">Add</button></form><p class="err" id="step-err"></p></section>
    <section class="panel"><h2>Opportunities</h2>${opps ? `<ul class="items">${opps}</ul>` : '<p class="empty">None in Salesforce.</p>'}</section>
    <section class="panel"><h2>People</h2>${contacts ? `<ul class="items">${contacts}</ul>` : '<p class="empty">No contacts in Salesforce.</p>'}</section>
    <section class="panel"><h2>Links</h2>${links ? `<ul class="items">${links}</ul>` : '<p class="empty">Add the prototype, backlog, Drive folder or docs.</p>'}
      <details style="margin-top:12px"><summary class="small">Edit links and sync matching</summary>
      <form id="meta"><p class="small muted">Links, one per line as <em>Name | https://…</em></p><textarea name="links">${esc(c.links.map(l => l.label + ' | ' + l.url).join('\n'))}</textarea>
      <p class="small muted">Extra email domains for the daily sync (Contacts' domains are used automatically)</p><textarea name="domains">${esc((c.match.domains || []).join('\n'))}</textarea>
      <p class="small muted">Extra email addresses</p><textarea name="emails">${esc((c.match.emails || []).join('\n'))}</textarea>
      <p class="small muted">Keywords that mean this client (e.g. project names)</p><textarea name="keywords">${esc((c.match.keywords || []).join('\n'))}</textarea>
      <label class="check small"><input type="checkbox" name="hidden" ${c.hidden ? 'checked' : ''}> Hide this account from the command center</label>
      <p><button class="primary">Save</button></p><p class="err" id="meta-err"></p></form></details></section>
  </aside>
  <section class="panel"><h2>Timeline</h2>
    <form id="add-note"><textarea name="body" placeholder="Add a note: what happened, what was decided…" maxlength="4000" required aria-label="Note"></textarea><p style="margin:8px 0 0"><button class="primary">Save note</button></p><p class="err" id="note-err"></p></form>
    <h3 style="margin-top:16px">Coming up</h3>${timeline(data.future, 'Nothing scheduled.')}
    <div class="now">Now</div>
    ${timeline(data.past, 'No history yet.')}
  </section></div>`;
  wireClient(c, data);
}

function wireClient(c, data) {
  const reload = () => route();
  const fail = (id, error) => { document.getElementById(id).textContent = error.message; };
  document.getElementById('add-step').onsubmit = async e => {
    e.preventDefault(); const f = e.target;
    try { await send('/steps', 'POST', { accountId: c.id, title: f.title.value, dueDate: f.dueDate.value || null }); reload(); } catch (error) { fail('step-err', error); }
  };
  document.getElementById('add-note').onsubmit = async e => {
    e.preventDefault();
    try { await send('/notes', 'POST', { accountId: c.id, body: e.target.body.value }); reload(); } catch (error) { fail('note-err', error); }
  };
  const metaPayload = (overrides = {}) => {
    const f = document.getElementById('meta');
    const links = lines(f.links.value).map(l => { const [label, ...rest] = l.split('|'); return { label: label.trim(), url: rest.join('|').trim() }; });
    return { links, match: { domains: lines(f.domains.value), emails: lines(f.emails.value), keywords: lines(f.keywords.value) }, pinned: c.pinned, hidden: f.hidden.checked, ...overrides };
  };
  document.getElementById('meta').onsubmit = async e => {
    e.preventDefault();
    try { await send(`/clients/${c.id}/meta`, 'PUT', metaPayload()); overview = null; reload(); } catch (error) { fail('meta-err', error); }
  };
  document.getElementById('pin').onclick = async () => {
    try { await send(`/clients/${c.id}/meta`, 'PUT', metaPayload({ pinned: !c.pinned })); overview = null; reload(); } catch (error) { fail('meta-err', error); }
  };
  $main.onclick = async e => {
    const t = e.target.closest('[data-step-done],[data-step-keep],[data-step-dismiss],[data-note-delete]');
    if (!t) return;
    try {
      if (t.dataset.stepDone) await send('/steps/' + t.dataset.stepDone, 'PATCH', { status: 'done' });
      else if (t.dataset.stepKeep) await send('/steps/' + t.dataset.stepKeep, 'PATCH', { keep: true });
      else if (t.dataset.stepDismiss) await send('/steps/' + t.dataset.stepDismiss, 'PATCH', { status: 'dismissed' });
      else if (t.dataset.noteDelete) { if (!confirm('Delete this note?')) return; await api('/notes/' + t.dataset.noteDelete, { method: 'DELETE' }); }
      overview = null; reload();
    } catch (error) { alert(error.message); }
  };
}

async function route(refresh = false) {
  const hash = location.hash.replace(/^#/, '') || '/';
  const client = hash.match(/^\/client\/([A-Za-z0-9]{15,18})$/);
  const view = client ? 'client' : hash === '/clients' ? 'clients' : 'today';
  document.querySelectorAll('[data-nav]').forEach(a => a.toggleAttribute('aria-current', a.dataset.nav === view || (view === 'client' && a.dataset.nav === 'clients')));
  $main.onclick = null;
  try {
    if (!overview || refresh) await loadOverview(refresh);
    if (view === 'client') {
      const data = await api('/clients/' + client[1]);
      document.title = data.client.name + ' | Command Center';
      renderClient(data);
    } else {
      document.title = (view === 'clients' ? 'Clients' : 'Today') + ' | Command Center';
      (view === 'clients' ? renderClients : renderToday)(overview);
    }
  } catch (error) {
    $main.innerHTML = `<div class="banner">${esc(error.message)}</div>`;
  }
}
document.getElementById('refresh').onclick = () => route(true);
addEventListener('hashchange', () => { scrollTo(0, 0); route(); });
route();
</script></body></html>
