<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>UEP has moved to Tribe Hub</title>
<style>
:root{--bg:#f7f6ef;--card:#fffdf8;--ink:#243f36;--muted:#59665e;--line:#d9dfd4;--client:#1f5fa8;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#141b18;--card:#1b2420;--ink:#e6ebe3;--muted:#a3b0a8;--line:#33423b;--client:#6fa0de;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:18px/1.6 system-ui,-apple-system,'Segoe UI',Arial,sans-serif;padding:24px 16px}
main{max-width:520px;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--client);border-radius:14px;padding:28px;display:flex;flex-direction:column;gap:14px}
h1{font:600 28px/1.2 Georgia,serif;margin:0}
p{margin:0;color:var(--muted)}
a.btn{align-self:flex-start;background:var(--ink);color:var(--bg);text-decoration:none;font-weight:600;padding:12px 20px;border-radius:10px}
</style>
</head>
<body>
<main>
  <h1>UEP's questions and changes have moved</h1>
  <p>Everything from this list, including every answer, is now in Tribe Hub, alongside the Scheduler's testing countdown and sign-off. Sign in with your email; Tribe Hub sends you a one-time code.</p>
  <a class="btn" id="go" href="https://hub.positivetribes.org/#/uep/home">Open Tribe Hub</a>
  <p>Taking you there now…</p>
</main>
<script>
// Old links keep working: #problems opens the test problems, #item-42 opens the same item in the hub.
(() => {
  const hash = location.hash;
  const item = (hash.match(/^#item-(\d+)$/) || [])[1];
  const target = 'https://hub.positivetribes.org/#/uep/' + (hash === '#problems' ? 'problems' : item ? 'old/' + item : 'home');
  document.getElementById('go').href = target;
  location.replace(target);
})();
</script>
</body>
</html>
