<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Your Positive Tribes workspace</title>
<link rel="icon" href="/brand/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
:root{
  --bg:#f7f6ef; --card:#fffdf8; --soft:#e9eddf; --ink:#243f36; --muted:#59665e; --line:#d9dfd4; --rust:#a94c32;
  --client:#a94c32;
  --must:#a3283a; --must-bg:#f7dde1; --nice:#8a5a00; --nice-bg:#f8ebc9; --idea:#3d5a80; --idea-bg:#dde6f1; --ok:#22693f; --ok-bg:#dbefe2;
  --display:'Fraunces',Georgia,serif; --font:'DM Sans',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  --shadow:0 1px 2px rgba(36,63,54,.06),0 8px 24px -12px rgba(36,63,54,.18); color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141b18; --card:#1b2420; --soft:#22302a; --ink:#e6ebe3; --muted:#a3b0a8; --line:#33423b; --rust:#e08a6d;
  --must:#f39aa7; --must-bg:#3e1f27; --nice:#efc36a; --nice-bg:#3a2f15; --idea:#9dbbe0; --idea-bg:#1f2b3a; --ok:#8fd1a6; --ok-bg:#183223;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141b18; --card:#1b2420; --soft:#22302a; --ink:#e6ebe3; --muted:#a3b0a8; --line:#33423b; --rust:#e08a6d;
  --must:#f39aa7; --must-bg:#3e1f27; --nice:#efc36a; --nice-bg:#3a2f15; --idea:#9dbbe0; --idea-bg:#1f2b3a; --ok:#8fd1a6; --ok-bg:#183223;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none !important}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 var(--font);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--rust);outline-offset:2px}
h1,h2,h3{margin:0;font-family:var(--display);font-weight:500;line-height:1.15;text-wrap:balance}
p{margin:0}
.shell{max-width:1080px;margin-inline:auto;padding:0 16px 64px}
.shell,.card,.stack>*{min-width:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:20px;text-decoration:none;color:var(--ink)}
.brand svg{width:30px;height:30px}.brand circle{fill:currentColor}.brand .core{fill:var(--client)}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.who{color:var(--muted);font-size:15px}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.bell-wrap{position:relative}
.bell{position:relative;display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);cursor:pointer}
.bell svg{width:22px;height:22px}
.bell[aria-expanded=true]{border-color:var(--ink)}
.bell-count{position:absolute;top:-6px;right:-6px;min-width:20px;padding:0 5px;border-radius:10px;background:var(--rust);color:#fff;font-size:12px;font-weight:700;line-height:20px;text-align:center}
.bell-panel{position:absolute;right:0;top:calc(100% + 8px);z-index:30;width:min(420px,calc(100vw - 28px));max-height:min(70vh,560px);overflow-y:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 32px -8px rgba(0,0,0,.28);font-size:15px}
.bell-panel .bp-head{position:sticky;top:0;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line)}
.bell-panel .bp-head h2{font-size:18px;margin:0}
.bell-panel .bp-link{background:none;border:0;padding:6px 0;color:var(--ink);font:inherit;font-size:14px;font-weight:600;text-decoration:underline;cursor:pointer;min-height:32px}
.bell-panel .bp-acts{display:flex;gap:14px}
.bell-panel ul{list-style:none;margin:0;padding:0}
.bell-panel li{border-bottom:1px solid var(--line)}
.bell-panel li:last-child{border-bottom:0}
.bell-panel .bp-row{display:flex;gap:10px;align-items:flex-start;padding:12px 16px;color:var(--ink);text-decoration:none}
.bell-panel a.bp-row:hover{background:var(--soft)}
.bell-panel .bp-dot{flex:none;width:9px;height:9px;margin-top:8px;border-radius:50%;background:transparent}
.bell-panel .unread .bp-dot{background:var(--rust)}
.bell-panel .unread .bp-text{font-weight:600}
.bell-panel .bp-body{flex:1;min-width:0;overflow-wrap:anywhere}
.bell-panel .bp-detail{margin:2px 0 0;color:var(--muted);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bell-panel .bp-meta{margin-top:2px;color:var(--muted);font-size:13px}
.bell-panel .bp-actions{display:flex;justify-content:flex-end;padding:0 16px 8px;margin-top:-6px}
.bell-panel .bp-pin{background:var(--soft)}
.bell-panel .bp-empty{padding:20px 16px;color:var(--muted);margin:0}
.bell-panel .bp-foot{padding:10px 16px;border-top:1px solid var(--line);text-align:center}
.hero{padding:18px 0 22px;border-bottom:1px solid var(--line);margin-bottom:6px;position:relative}
.hero-sf{position:absolute;right:0;bottom:18px;display:inline-flex;align-items:center}
.hero:before{content:"";display:block;width:56px;height:5px;border-radius:3px;background:var(--client);margin-bottom:14px}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
h1{font-size:clamp(30px,6vw,44px);margin-top:4px}
nav.tabs{display:flex;gap:4px;margin:6px 0 22px;overflow-x:auto}
nav.tabs a{padding:12px 16px;text-decoration:none;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs a[aria-current=page]{color:var(--ink);border-color:var(--client)}
nav.tabs a.tab-end{margin-left:auto;align-self:center;padding:6px 14px;min-height:36px;display:inline-flex;align-items:center;color:var(--bg);background:var(--ink);border:1px solid var(--ink);border-radius:10px;font-size:14px}
nav.tabs a.tab-end:hover{opacity:.88}
nav.tabs a.tab-end[aria-current=page]{color:var(--bg);border-color:var(--ink);box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--client)}
nav.tabs a.tab-end .badge{background:var(--bg);color:var(--ink)}
.badge{display:inline-block;min-width:20px;margin-left:6px;padding:0 6px;border-radius:10px;background:var(--ink);color:var(--bg);font-size:12px;line-height:20px;text-align:center}
.stack{display:flex;flex-direction:column;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
.btn{display:inline-block;border:1px solid var(--ink);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-weight:600;text-decoration:none;min-height:44px}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.small{padding:6px 12px;min-height:36px;font-size:15px}
.btn.danger{color:var(--must);border-color:var(--must)}
.btn:disabled{opacity:.45;cursor:default}
.muted{color:var(--muted)}
.meta{font-size:14px;color:var(--muted)}
.error{background:var(--must-bg);color:var(--must);border-radius:10px;padding:10px 14px;font-weight:600}
.preview-bar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;margin:0 0 8px;font-size:15px}
.preview-bar b{font-weight:700}
.preview-bar button{background:var(--bg);color:var(--ink);border:0;border-radius:8px;padding:6px 12px;font-weight:700;min-height:36px;cursor:pointer}
/* Home */
.next{border-left:6px solid var(--client);display:flex;flex-direction:column;gap:10px}
.next h2{font-size:clamp(24px,4.5vw,32px)}
.label{font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--rust)}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr))}
.steps{display:flex;gap:0;margin:12px 0 4px;list-style:none;padding:0}
.steps li{flex:1;min-width:0;text-align:center;font-size:12px;color:var(--muted);position:relative;padding-top:22px;line-height:1.2;white-space:nowrap}
.steps li span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.steps li.now span{position:static;width:auto;height:auto;clip:auto;overflow:visible;display:block;margin-top:2px}
/* Hover or tap any other dot to see which part of the process it is. */
.steps li:not(.now){cursor:default}
.steps li:not(.now):hover span,.steps li:not(.now):focus-visible span{width:auto;height:auto;clip:auto;overflow:visible;bottom:calc(100% - 2px);left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:4px 10px;border-radius:6px;font-size:13px;font-weight:600;z-index:2;box-shadow:var(--shadow)}
.steps li:first-child:not(.now):hover span,.steps li:first-child:not(.now):focus-visible span{left:0;transform:none}
.steps li:last-child:not(.now):hover span,.steps li:last-child:not(.now):focus-visible span{left:auto;right:0;transform:none}
.steps li:not(.now):focus-visible{outline:none}
.steps li:not(.now):focus-visible:before{outline:3px solid var(--rust);outline-offset:2px}
.steps li:before{content:"";position:absolute;top:5px;left:50%;width:12px;height:12px;border-radius:50%;background:var(--line);transform:translateX(-50%);z-index:1}
.steps li:after{content:"";position:absolute;top:10px;left:-50%;width:100%;height:2px;background:var(--line)}
.steps li:first-child:after{display:none}
.steps li.done:before,.steps li.done:after,.steps li.now:after{background:var(--client)}
.steps li.done:before{background:var(--client)}
.steps li.now:before{background:var(--card);border:3px solid var(--client);width:16px;height:16px;top:3px}
.steps li.now{color:var(--ink);font-weight:700;overflow:visible}
/* Testing countdown: a client phase in UAT, at most 30 days, then signed off. */
.uat{border-left:6px solid var(--client);display:flex;flex-wrap:wrap;align-items:center;gap:12px 28px}
.uat .left{font-family:var(--display);font-size:clamp(44px,9vw,64px);line-height:1;white-space:nowrap}
.uat.soon .left,.uat.late .left{color:var(--rust)}
.uat .what{flex:1 1 260px;min-width:0;display:flex;flex-direction:column;gap:4px}
.uat .what h2{font-size:22px;font-family:var(--font);font-weight:700}
.uat .actions{flex-basis:100%}
.track{height:6px;border-radius:3px;background:var(--line);overflow:hidden;flex-basis:100%}
.track span{display:block;height:100%;background:var(--client)}
.uat.soon .track span,.uat.late .track span{background:var(--rust)}
/* Build and Testing repeat once per client phase: a bracket under those two steps with one pip per phase. */
.steps-wrap{position:relative;display:flow-root}
.steps-wrap .zone{position:absolute;top:11px;height:24px;left:calc(var(--from) * 100% / var(--steps) + 4px);width:calc(var(--span) * 100% / var(--steps) - 8px);border-radius:12px;background:color-mix(in srgb,var(--client) 18%,transparent)}
.steps-wrap .steps{position:relative}
.loop{margin:2px 0 0 calc(var(--from) * 100% / var(--steps));width:calc(var(--span) * 100% / var(--steps));display:flex;flex-direction:column;align-items:center;gap:5px}
.loop .bracket{width:calc(100% - 24px);height:8px;border:2px solid var(--client);border-top:0;border-radius:0 0 8px 8px;opacity:.7}
.loop .pips{display:flex;gap:5px;list-style:none;margin:0;padding:0}
.loop .pips li{width:10px;height:10px;border-radius:50%;background:var(--line)}
.loop .pips li.done{background:var(--client)}
.loop .pips li.now{background:var(--card);box-shadow:inset 0 0 0 3px var(--client)}
.loop .pips li.ready{background:color-mix(in srgb,var(--client) 40%,var(--line))}
.loop .note{font-size:12px;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:4px}
.loop .note svg{width:12px;height:12px;flex:none}
.doc-folder{border-top:1px solid var(--line);padding:10px 0}.doc-folder:first-of-type{border-top:0}
.doc-folder>summary{cursor:pointer;font-weight:700;font-size:16px}
.releases{list-style:none;margin:14px 0 0;padding:0;font-size:15px}
.releases li{padding:10px 0;border-top:1px solid var(--line)}
.releases li:first-child{border-top:0;padding-top:0}
.rel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.rel-name b{margin-right:8px}
.rel-sub{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;margin-top:4px}
.rel-sub .meta{margin:0}
.admin-link{font-size:14px;font-weight:600;color:var(--ink);text-decoration-color:var(--client);text-decoration:underline;text-underline-offset:2px}
.admin-only{margin:4px 0 0;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.pill.stage{background:var(--soft);color:var(--ink);text-transform:none;letter-spacing:0;font-weight:600}
.pill.stage.uat{background:var(--client);color:#fff}
.docs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.docs li{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 0;border-top:1px solid var(--line)}
.docs li:first-child{border-top:0;padding-top:4px}
.docs .doc-title{display:flex;flex-direction:column;gap:2px;flex:1 1 220px;min-width:0}
.docs .doc-title b{font-weight:650}
.pill.doc{text-transform:none;letter-spacing:0;font-weight:600;background:var(--soft);color:var(--ink)}
.pill.doc.signed{background:var(--ok-bg);color:var(--ok)}
.pill.sys{text-transform:none;letter-spacing:0;font-weight:600;background:var(--soft);color:var(--ink)}.pill.sys.up{background:var(--ok-bg);color:var(--ok)}.pill.sys.down{background:var(--must-bg);color:var(--must)}
.shots{display:flex;gap:8px;flex-wrap:wrap}
.shot{position:relative;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.shot button.thumb{padding:0;border:1px solid var(--line);border-radius:8px;background:var(--soft);overflow:hidden;width:132px;height:88px;display:block}
.shot button.thumb:hover{border-color:var(--ink)}
.shot img{width:100%;height:100%;object-fit:cover;object-position:top left;display:block}
.drop{border:2px dashed var(--line);border-radius:10px;padding:10px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:15px;color:var(--muted)}
.drop.over{border-color:var(--client);background:color-mix(in srgb,var(--client) 8%,transparent)}
.drop input[type=file]{position:absolute;width:1px;height:1px;opacity:0}
.drop label{margin:0}
dialog.shot-view{border:0;padding:0;background:transparent;max-width:min(1200px,96vw);max-height:94vh}
dialog.shot-view::backdrop{background:rgba(10,15,13,.82)}
dialog.shot-view img{display:block;max-width:100%;max-height:86vh;border-radius:10px;margin-inline:auto}
dialog.shot-view .bar{justify-content:flex-end;margin-bottom:8px}
.pill.idea-status{text-transform:none;letter-spacing:0;font-weight:600;background:var(--soft);color:var(--ink)}
.pill.idea-status.next{background:var(--client);color:#fff}.pill.idea-status.shipped{background:var(--ok-bg);color:var(--ok)}.pill.idea-status.declined{background:transparent;border:1px solid var(--line);color:var(--muted)}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.list li a{color:inherit;display:flex;gap:10px;align-items:baseline;padding:10px 4px;text-decoration:none;border-bottom:1px solid var(--line)}
.list li:last-child a{border-bottom:0}.list li a:hover{color:var(--rust)}
/* Backlog */
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px;flex-wrap:wrap;max-width:100%}
.seg button{border:0;background:none;padding:8px 14px;border-radius:9px;font-weight:600;min-height:40px}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.seg.small button{padding:4px 10px;min-height:32px;font-size:14px;font-weight:500}
.pill{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 10px;border-radius:99px;white-space:nowrap}
.pill.must{background:var(--must-bg);color:var(--must)}.pill.nice{background:var(--nice-bg);color:var(--nice)}.pill.idea{background:var(--idea-bg);color:var(--idea)}.pill.done{background:var(--ok-bg);color:var(--ok)}
.pill.phase{background:transparent;border:1px solid var(--line);color:var(--muted);text-transform:none;letter-spacing:0;font-weight:500}
.legend{display:grid;gap:8px;margin:0;padding:0;list-style:none;font-size:15px}
.legend li{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.filters button{border:1px solid var(--line);background:var(--card);padding:5px 12px;border-radius:99px;font-size:15px}
.filters button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
label{display:block;font-weight:600;font-size:15px;margin-bottom:4px}
input[type=text],textarea,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
textarea{min-height:80px;resize:vertical}
.row{display:flex;gap:12px;flex-wrap:wrap}.row>*{flex:1 1 180px}
section.tier{display:flex;flex-direction:column;gap:10px}
section.tier h2{font-size:22px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.count{font-family:var(--font);font-size:15px;color:var(--muted);font-weight:400}
.item{display:flex;flex-direction:column;gap:10px}.item h3{font-size:20px;font-family:var(--font);font-weight:600}
.item p{white-space:pre-wrap;overflow-wrap:anywhere}.item.flash{outline:3px solid var(--client);outline-offset:3px}
.item.is-done h3{color:var(--muted)}
.answer{background:var(--ok-bg);border-radius:10px;padding:10px 14px}
.care-meter{display:grid;grid-template-columns:repeat(auto-fill,minmax(18px,1fr));gap:5px;max-width:420px}
.care-meter i{height:14px;border-radius:4px;background:var(--soft)}
.care-meter i.used{background:var(--ok)}.care-meter i.roll{background:var(--idea-bg);outline:1.5px dashed var(--idea);outline-offset:-1.5px}
.care-note{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:14px}
.care-steps{margin:0;padding-left:20px;font-size:14px;display:grid;gap:4px}
.answer b{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ok)}
.actions{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.spacer{flex:1}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--must-bg);border-radius:10px;padding:8px 12px}
.empty{color:var(--muted);font-style:italic}
details.done-list>summary{cursor:pointer;font-weight:600;padding:6px 0}
select.client-switch{width:auto;max-width:15em;font-size:15px;min-height:36px;padding:5px 30px 5px 10px;text-overflow:ellipsis}
.admin-bar{display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap;background:var(--soft);border-radius:12px;padding:8px 12px;margin:0 0 8px;font-size:14px;color:var(--muted)}
.admin-label{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-right:auto}
.admin-field{display:flex;align-items:center;gap:8px;font-weight:600}
.admin-field select[hidden]{display:none}
.admin-field:has(select[hidden]){display:none}
/* Command center (Positive Tribes' home page). Scoped under .cc so it never changes a client workspace. */
.badge:empty{display:none}
.cc-bar{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;margin:6px 0 22px}
.cc-bar nav.tabs{margin:0;flex:1 1 auto}
.cc-sync.late{color:var(--nice)}
.cc-ideas{display:inline-flex;align-items:center;font-size:14px;font-weight:600;color:var(--bg);background:var(--ink);border:1px solid var(--ink);border-radius:10px;padding:6px 14px;min-height:36px;text-decoration:none;white-space:nowrap}
.cc-ideas:hover{opacity:.88}
.cc-ideas[aria-current=page]{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--client)}
.cc-ideas .badge{background:var(--bg);color:var(--ink)}
.seg.subnav{margin-bottom:18px}
.seg a{padding:4px 12px;border-radius:9px;font-weight:600;font-size:14px;text-decoration:none;min-height:32px;display:inline-flex;align-items:center;color:var(--muted)}
.seg a[aria-current=page]{background:var(--ink);color:var(--bg)}
.cc{font-size:15px;line-height:1.55}
.cc a{color:inherit}
.cc h2{font-size:20px;margin-bottom:12px}
.cc h2.greet{font-size:clamp(26px,4vw,34px);margin:0}
.cc h3{font-family:var(--font);font-size:16px;font-weight:700;margin-top:16px}
.cc .small{font-size:13px}
.cc .meta{font-size:13px;color:var(--muted);overflow-wrap:anywhere}

.cc .chip{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;padding:2px 8px;border-radius:20px;background:var(--soft);color:var(--muted);max-width:100%}

.cc .links{margin:6px 0 16px;line-height:1.5}
.cc .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px}
.cc .card{display:flex;flex-direction:column;gap:10px;text-decoration:none}

.cc .now:before,.cc .now:after{content:"";flex:1;height:2px;background:var(--rust)}
.cc form.inline{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.cc form.inline input[type=text]{flex:1 1 180px;width:auto}

.cc input[type=text],.cc input[type=url],.cc input[type=date],.cc select,.cc textarea{font-size:14px;padding:7px 9px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-width:0}

.cc label.check{display:flex;gap:8px;align-items:flex-start;cursor:pointer;font-weight:400;font-size:inherit;margin:0}
.cc label.check input{margin-top:4px}
.cc details{margin-top:12px}
.cc .docform{margin-bottom:18px;padding:0}
.cc .docform>summary{cursor:pointer;list-style:none;padding:14px 24px;font-family:var(--display);font-size:20px;font-weight:600;color:var(--ink)}
.cc .docform>summary::-webkit-details-marker{display:none}

.cc .docform label.check{flex-direction:row;align-items:center;color:var(--ink);font-weight:400;font-size:14px}
.cc .docform label.check input{width:auto;margin:0;flex:none}
.cc .docform label.check{padding-top:22px;gap:10px}
.cc .docform input,.cc .docform select{width:100%;font-weight:400}
.cc .docform select:disabled,.cc .docform input:disabled{opacity:.5}
.cc .docform .actions{margin:14px 0 0}
.cc .doc-groups .row h2.grow{display:flex;align-items:baseline;gap:8px}
.cc .doc-groups .row h2.grow .count{margin:0}
.cc .doc-groups .links{margin:2px 0 14px;line-height:1.5}
.cc .doc-groups .items>li{padding:12px 0}
.cc .doc-groups .items>li:first-child{padding-top:0}
.cc .doc-groups .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.cc .doc-groups .small{margin-top:6px;display:flex;gap:14px}
.cc .group>summary{cursor:pointer;list-style:none;display:flex;align-items:baseline;gap:8px}
.cc .group>summary::-webkit-details-marker{display:none}
.cc .group>summary::before{content:'\25B6';font-size:12px;color:var(--muted);transition:transform .15s}
.cc .group[open]>summary::before{transform:rotate(90deg)}
.cc .group>summary h2{margin:0}
.cc .group[open]>summary{margin-bottom:4px}
.cc .folder{border-top:1px solid var(--line);padding:10px 0}
.cc .folder:first-of-type{border-top:0}
.cc .folder>summary{cursor:pointer;font-weight:700;font-size:15px;list-style:revert}
.cc .folder .items{margin-top:8px}
.cc .folder.drop{background:var(--soft);border-radius:8px;outline:2px dashed var(--rust);outline-offset:2px}
.cc .items li[draggable=true]{cursor:grab}.cc .items li.dragging{opacity:.4}
.cc .doc-groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr));gap:18px;align-items:start}
.cc .items li.editing{outline:2px solid var(--rust);outline-offset:4px;border-radius:6px}
@media (max-width:700px){.cc .docform .fields{grid-template-columns:minmax(0,1fr)}.cc .docform label.wide{grid-column:auto}}
.cc details summary{cursor:pointer;font-weight:600}
.cc details[open] summary{margin-bottom:10px}
.cc .note-save{margin:8px 0 0}
.cc .empty{font-size:14px}
.cc #meta p{margin:10px 0 4px}
.cc .err{color:var(--rust);font-size:13px;min-height:1em}

.cc .countdown .days{font-family:var(--display);font-size:40px;line-height:1}
.cc .countdown.soon .days{color:var(--nice)}.cc .countdown.over .days{color:var(--rust)}
.cc .nowcard{border-left:6px solid var(--rust);margin-bottom:22px}
.cc .nowcard .label{margin:0 0 6px}
.cc .nowcard h2{font-size:26px;margin-bottom:6px;overflow-wrap:anywhere}
.cc .nowcard h2 a{text-decoration:none}.cc .nowcard h2 a:hover{text-decoration:underline}
.cc .nowcard .why{margin:0 0 12px}
.cc .nowcard .later{margin-top:14px;padding-top:10px;border-top:1px solid var(--line)}
.cc .said{margin:6px 0 0;font-size:13.5px;white-space:pre-wrap;overflow-wrap:anywhere;border-left:3px solid var(--line);padding-left:10px}
@media (max-width:1000px){.cc .cols,.cc .detail{grid-template-columns:minmax(0,1fr)}}
@media (max-width:520px){.shell{padding-inline:14px}.who{display:none}.card{padding:16px}}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}}
</style>

<body>
<div class="shell">
  <header class="top">
    <a class="brand" href="#/"><svg viewBox="0 0 152 152" aria-hidden="true"><circle cx="76" cy="22" r="22"/><circle cx="130" cy="76" r="22"/><circle cx="76" cy="130" r="22"/><circle cx="22" cy="76" r="22"/><circle class="core" cx="76" cy="76" r="22"/></svg><span>Positive Tribes</span></a>
    <div class="tools"><div class="bell-wrap" id="bell-wrap" hidden><button class="bell" id="bell" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="bell-panel" aria-label="Notifications"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15L6 16Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M10 20.5a2.2 2.2 0 0 0 4 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span class="bell-count" id="bell-count" hidden></span></button><div class="bell-panel" id="bell-panel" role="region" aria-label="Notifications" hidden></div></div><span class="who" id="who"></span><button class="btn ghost small" id="theme" type="button" aria-label="Switch between light and dark">Light / dark</button></div>
  </header>
  <div class="admin-bar" id="admin-bar" hidden>
    <span class="admin-label">Positive Tribes</span>
    <label class="admin-field">Client <select id="switch" class="client-switch" hidden></select></label>
    <label class="admin-field">Preview as <select id="preview" class="client-switch" hidden></select></label>
  </div>
  <div id="preview-bar" class="preview-bar" role="status" hidden></div>
  <div id="error" class="error" role="alert" hidden></div>
  <main id="main" aria-live="polite"><p class="muted">Loading your workspace…</p></main>
</div>
<script src="/command.js"></script>
<dialog id="shot-view" class="shot-view" aria-label="Screenshot"><div class="bar"><a class="btn small" id="shot-open" target="_blank" rel="noopener">Open full size</a><button class="btn small" type="button" id="shot-close">Close</button></div><img id="shot-img" alt=""></dialog>
<script>
(() => {
  const TIER_NAMES = {
    question: [['must', 'Need an answer soon', 'The plan changes depending on the answer.'], ['nice', 'Need it before we build', 'Not needed for the prototype, but needed before the real build.'], ['idea', 'No rush', 'Nothing depends on it yet.']],
    change: [['must', 'Must have', 'It does not work for its purpose without it.'], ['nice', 'Nice to have', 'Makes it better. In the first release if there is room.'], ['idea', 'Idea for now', 'Worth remembering. Not decided, not promised.']],
    problem: [['must', 'Stops sign-off', 'The phase cannot be accepted until it is fixed.'], ['nice', 'Fix before launch', 'Works, but is confusing or looks wrong.'], ['idea', 'Minor', 'Small polish. Fine to fix later.']],
    request: [['must', 'Urgent', 'Something is stopping your team from working.'], ['nice', 'Soon', 'Important, but you can work around it.'], ['idea', 'When there is time', 'Nice to have.']]
  };
  const KIND_TABS = [['question', 'Open questions'], ['change', 'Suggested changes'], ['problem', 'Test problems'], ['request', 'Support requests']];
  const DONE_WORD = { question: 'answered', change: 'done', problem: 'fixed', request: 'resolved' };
  const PHASES = [['review', 'To review'], ['prototype', 'Prototype'], ['full', 'Full build'], ['later', 'Later']];
  const STEPS = [['kickoff', 'Kickoff'], ['discovery', 'Discovery'], ['prototype', 'Prototype'], ['build', 'Build'], ['uat', 'Testing'], ['launch', 'Launch'], ['hypercare', 'Settling in'], ['support', 'Care plan']];
  const $ = id => document.getElementById(id);
  // Positive Tribes' home page: the command center, drawn by command.js under the same header.
  const COMMAND = 'command';
  let command = null;
  const LOOP = ['build', 'uat'];
  const loopIcon = () => { const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); s.setAttribute('viewBox', '0 0 16 16'); s.setAttribute('aria-hidden', 'true'); s.innerHTML = '<path d="M13 8a5 5 0 1 1-1.5-3.6M13 2.5v2.8h-2.8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>'; return s; };
  const STAGES = { planned: 'Planned', building: 'Being built', waiting: 'Built, waiting its turn', uat: 'Testing', signed_off: 'Signed off', live: 'Live' };
  const state = { me: null, slug: '', client: null, projects: [], releases: [], signing: null, items: [], view: 'home', project: null, kind: 'question', filter: 'all', editing: null, confirming: null, flash: null, people: [], preview: null, documents: [], status: null, ideas: [], ideaFilter: 'new', ideaEditing: null, ideaFiles: [] };

  const store = {
    get(k) { try { return sessionStorage.getItem(k) || ''; } catch { return ''; } },
    set(k, v) { try { v ? sessionStorage.setItem(k, v) : sessionStorage.removeItem(k); } catch {} }
  };
  const themeStore = {
    get() { try { return localStorage.getItem('hub-theme') || ''; } catch { return ''; } },
    set(v) { try { localStorage.setItem('hub-theme', v); } catch {} }
  };
  if (themeStore.get()) document.documentElement.dataset.theme = themeStore.get();
  $('theme').addEventListener('click', () => {
    const dark = document.documentElement.dataset.theme === 'dark' || (!document.documentElement.dataset.theme && matchMedia('(prefers-color-scheme:dark)').matches);
    document.documentElement.dataset.theme = dark ? 'light' : 'dark';
    themeStore.set(document.documentElement.dataset.theme);
  });
  // Local development only: ?as=person@example.org sends a stand-in identity that the server honors on localhost.
  const asParam = new URLSearchParams(location.search).get('as');
  if (asParam) store.set('hub-dev-email', asParam);

  function h(tag, attrs = {}, ...children) {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (v === false || v == null) continue;
      if (k === 'class') node.className = v;
      else if (k.startsWith('on')) node.addEventListener(k.slice(2), v);
      else node.setAttribute(k, v === true ? '' : v);
    }
    for (const c of children.flat()) if (c != null && c !== false) node.append(c);
    return node;
  }
  const showError = message => { $('error').textContent = message || ''; $('error').hidden = !message; };

  // Positive Tribes can preview a client's workspace as one of its people. The page only changes what it shows:
  // the server still knows it is Positive Tribes, so a preview must never send changes.
  const viewer = () => state.preview || state.me.user;
  const ROLE_NAMES = { ed: 'Director', staff: 'Staff', pt: 'Positive Tribes' };
  async function api(path, options = {}) {
    if (state.preview && options.method && options.method !== 'GET') throw new Error('This is a read-only preview. Exit the preview to make changes.');
    const headers = { 'content-type': 'application/json' };
    if (store.get('hub-dev-email')) headers['x-dev-email'] = store.get('hub-dev-email');
    let response;
    try { response = await fetch('/api' + path, { ...options, headers }); }
    catch { throw new Error('Could not reach the server. Check your connection and try again.'); }
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.error || 'Something went wrong. Please try again.');
    return data;
  }
  async function act(path, options) {
    showError('');
    try { const data = await api(path, options); if (data.items) state.items = data.items; if (data.care) state.care = data.care; render(); }
    catch (e) { showError(e.message); }
  }
  const base = () => '/c/' + state.slug;
  const post = b => ({ method: 'POST', body: JSON.stringify(b) });
  const patch = b => ({ method: 'PATCH', body: JSON.stringify(b) });
  const firstName = () => (viewer().name || '').split(/\s+/)[0].toLowerCase();
  const open = items => items.filter(i => !i.done);
  const link = (view, id) => '#/' + state.slug + '/' + view + (id ? '/' + id : '');

  async function loadClient(slug) {
    const [p, i, d, st, care] = await Promise.all([api('/c/' + slug + '/projects'), api('/c/' + slug + '/items'), api('/ideas').catch(() => ({ ideas: [] })), api('/c/' + slug + '/status').catch(() => null), api('/c/' + slug + '/care').catch(() => null)]);
    Object.assign(state, { care, status: st, slug, client: p.client, projects: p.projects, releases: p.releases || [], documents: p.documents || [], items: i.items, ideas: d.ideas, preview: null, people: [] });
    if (state.me.user.role === 'pt') { try { state.people = (await api('/c/' + slug + '/people')).people; } catch {} }
    document.documentElement.style.setProperty('--client', p.client.accent);
    document.title = p.client.name + ' | Positive Tribes';
    if (!state.projects.some(x => x.id === state.project)) state.project = state.projects[0] && state.projects[0].id;
  }

  async function route() {
    showError('');
    const ptUser = state.me.user.role === 'pt';
    // Positive Tribes lands on the command center; #/command/inbox, #/command/clients, #/command/client/<id> are its views.
    const cmd = location.hash.match(/^#\/command(?:\/(.*))?$/);
    if (ptUser && (cmd || !location.hash.replace(/^#\/?/, ''))) { renderCommand(cmd ? cmd[1] || '' : ''); return; }
    state.mode = 'client';
    const [, slug, view, id] = location.hash.match(/^#\/([a-z0-9-]*)\/?([a-z]*)\/?(\d*)/) || [];
    const wanted = (slug !== COMMAND && slug) || (state.me.clients[0] && state.me.clients[0].slug);
    if (!wanted) { $('main').replaceChildren(h('div', { class: 'card' }, h('h2', {}, 'Welcome'), h('p', { class: 'muted' }, 'There are no workspaces for you yet. Positive Tribes will set one up.'))); return; }
    try { if (wanted !== state.slug) await loadClient(wanted); } catch (e) { showError(e.message); return; }
    // Coming back from the command center to the same client restores its accent and title.
    document.documentElement.style.setProperty('--client', state.client.accent);
    document.title = state.client.name + ' | Positive Tribes';
    state.view = view === 'backlog' || view === 'problems' ? 'backlog' : view === 'ideas' ? 'ideas' : view === 'documents' ? 'documents' : 'home';
    // #/uep/problems opens the test problems of the project being tested (the link in UAT scripts).
    if (view === 'problems') {
      const testing = state.releases.find(r => r.stage === 'uat');
      state.kind = 'problem'; state.filter = 'all';
      if (testing) state.project = testing.project_id;
    }
    if (id) {
      // #/uep/old/42 is item 42 on the client's old backlog site, so old links keep working.
      const item = view === 'old' ? state.items.find(i => i.legacy_id === Number(id)) : state.items.find(i => i.id === Number(id));
      if (item) { state.view = 'backlog'; state.project = item.project_id; state.kind = item.kind; state.filter = 'all'; state.flash = item.id; }
    }
    render();
    if (state.flash) {
      const node = document.getElementById('item-' + state.flash);
      state.flash = null;
      if (node) { const fold = node.closest('details'); if (fold) fold.open = true; node.classList.add('flash'); node.scrollIntoView({ block: 'center' }); }
    }
  }

  // The header and admin bar, the same on the command center and in every client workspace.
  function renderBar() {
    const inCommand = state.mode === COMMAND;
    const sw = $('switch');
    // A client's person only ever sees their own workspace, so the client switch hides during a preview.
    const ptUser = state.me.user.role === 'pt';
    sw.hidden = (state.me.clients.length < 2 && !ptUser) || Boolean(state.preview);
    // Positive Tribes' own entry is the command center, its home page here in the hub.
    sw.replaceChildren(
      ...ptUser ? [h('option', { value: COMMAND, ...(inCommand ? { selected: true } : {}) }, 'Positive Tribes (command center)'), h('option', { disabled: true }, '\u2500\u2500\u2500\u2500\u2500\u2500')] : [],
      ...state.me.clients.map(c => h('option', { value: c.slug, ...(!inCommand && c.slug === state.slug ? { selected: true } : {}) }, c.name)));
    const pv = $('preview');
    // Preview as is about one client's people, so it shows only inside a client workspace.
    pv.hidden = !ptUser || inCommand || !state.people.length;
    pv.replaceChildren(h('option', { value: '' }, 'Off (your view)'), ...state.people.map(u =>
      h('option', { value: u.email, ...(state.preview && state.preview.email === u.email ? { selected: true } : {}) }, u.name + ' (' + ROLE_NAMES[u.role] + ')')));
    $('admin-bar').hidden = sw.hidden && pv.hidden && !state.preview;
    const bar = $('preview-bar');
    bar.hidden = !state.preview;
    bar.replaceChildren(...(state.preview ? [
      h('span', {}, 'Previewing as ', h('b', {}, state.preview.name), ' (' + ROLE_NAMES[state.preview.role] + ') \u00b7 read-only. They also need to be on the Access list to sign in.'),
      h('button', { type: 'button', onclick: () => setPreview('') }, 'Exit preview')] : []));
    $('who').textContent = viewer().name || viewer().email;
  }

  // ---- Command center (Positive Tribes only): Today, Inbox, Clients and each client's page ----
  function renderCommand(sub) {
    const first = state.mode !== COMMAND;
    Object.assign(state, { mode: COMMAND, preview: null, editing: null, confirming: null, signing: null, ideaEditing: null });
    document.documentElement.style.setProperty('--client', 'var(--rust)');
    renderBar();
    command = command || window.CommandCenter({ api });
    const { view } = command.viewOf(sub);
    // The old #/command/triage address moves to its place under Care plans.
    if (sub === 'triage') { location.replace('#/command/care/triage'); return; }
    const current = (key, also) => view === key || view === also ? { 'aria-current': 'page' } : {};
    const tab = (key, href, label, extra, also) => h('a', { href, ...current(key, also) }, label, extra);
    // Five daily tabs; Improve this hub sits apart at the right end, its new ideas also reach the Inbox.
    const tabs = (inboxBadge, careBadge) => [tab('today', '#/command', 'Today'), tab('inbox', '#/command/inbox', 'Inbox', inboxBadge), tab('clients', '#/command/clients', 'Clients', null, 'client'),
      tab('care', '#/command/care', 'Care plans', careBadge, 'triage'), tab('documents', '#/command/documents', 'Documents')];
    const ideasLink = () => h('a', { class: 'cc-ideas', id: 'cc-ideas', href: '#/command/ideas', ...current('ideas') }, 'Improve this hub', h('span', { class: 'badge', id: 'cc-ideas-count' }));
    const box = h('div', { class: 'cc', id: 'cc' }, h('p', { class: 'muted' }, 'Loading the command center…'));
    const keep = !first && $('cc') && $('cc-tabs');
    if (keep) {
      // Moving between command center views keeps the hero and tab row; only the view below changes.
      $('cc-tabs').replaceChildren(...tabs($('cc-inbox-count'), $('cc-care-count')));
      $('cc-ideas').replaceWith(ideasLink());
      $('cc').replaceWith(box);
    } else {
      $('main').replaceChildren(
        h('div', { class: 'hero' }, h('div', { class: 'eyebrow' }, 'Command center'), h('h1', {}, 'Positive Tribes')),
        h('div', { class: 'cc-bar' },
          h('nav', { class: 'tabs', id: 'cc-tabs', 'aria-label': 'Command center' }, ...tabs(h('span', { class: 'badge', id: 'cc-inbox-count' }), h('span', { class: 'badge', id: 'cc-care-count' }))),

      pending,
      h('div', { class: 'row' }, h('div', {}, h('label', { for: 'i-tier' }, 'How much does it matter?'), tier)),
      h('div', {}, h('button', { class: 'btn', type: 'submit' }, 'Send idea')));
    form.addEventListener('paste', e => { const files = pastedImages(e); if (files.length) { e.preventDefault(); take(files); } });
    return form;
  }
  const shotList = (i, remove) => i.images.length > 0 && h('div', { class: 'shots' }, i.images.map((id, n) => h('div', { class: 'shot' },
    h('button', { type: 'button', class: 'thumb', 'aria-label': 'View screenshot ' + (n + 1) + ' for ' + i.title, onclick: e => showShot(e.currentTarget.querySelector('img')) }, shotImg(i.id, id, 'Screenshot ' + (n + 1) + ' for ' + i.title)),
    remove && h('button', { type: 'button', class: 'btn ghost small', onclick: () => remove(id) }, 'Remove'))));
  function ideaCard(i, isPt) {
    if (state.ideaEditing === i.id) return ideaEditor(i, isPt);
    const status = IDEA_STATUS.find(s => s[0] === i.status)[1];
    return h('article', { class: 'card item' },
      h('div', { class: 'actions' },
        h('span', { class: 'pill ' + i.tier }, IDEA_TIERS.find(t => t[0] === i.tier)[1]),
        h('span', { class: 'pill idea-status ' + i.status }, status),
        isPt && h('span', { class: 'pill phase' }, i.client_name)),
      h('h3', {}, i.title),
      i.details && h('p', { class: 'muted' }, i.details),
      shotList(i),
      i.note ? h('div', { class: 'answer' }, h('b', {}, 'Positive Tribes'), h('p', {}, i.note)) : !isPt && h('p', { class: 'meta' }, IDEA_HELP[i.status]),
      h('div', { class: 'meta' }, (i.added_by || 'Someone') + ' · ' + i.created_at.slice(0, 10) + (i.shipped_at ? ' · shipped ' + i.shipped_at.slice(0, 10) : '')),
      isPt && h('div', { class: 'actions' }, h('span', { class: 'meta' }, 'Decide:'), h('span', { class: 'seg small', role: 'group', 'aria-label': 'Status of ' + i.title },
        IDEA_STATUS.map(([k, l]) => h('button', { type: 'button', 'aria-pressed': String(i.status === k), onclick: () => i.status !== k && actIdea('/' + i.id, patch({ status: k })) }, l)))),
      (isPt || i.status === 'new') && h('div', { class: 'actions' }, h('span', { class: 'spacer' }),
        h('button', { class: 'btn ghost small', type: 'button', onclick: () => { state.ideaEditing = i.id; render(); } }, isPt ? 'Reply or edit' : 'Edit'),
        isPt && h('button', { class: 'btn ghost small', type: 'button', onclick: () => { state.confirming = 'idea-' + i.id; render(); } }, 'Delete')),
      state.confirming === 'idea-' + i.id && h('div', { class: 'confirm', role: 'alert' }, h('span', {}, 'Delete this idea for everyone? This cannot be undone.'),
        h('button', { class: 'btn small danger ghost', type: 'button', onclick: () => { state.confirming = null; actIdea('/' + i.id, { method: 'DELETE' }); } }, 'Delete'),
        h('button', { class: 'btn ghost small', type: 'button', onclick: () => { state.confirming = null; render(); } }, 'Keep it')));
  }
  // Screenshot changes while editing keep the editor open.
  const keepEditing = async (path, options) => {
    showError('');
    try { state.ideas = (await api('/ideas' + path, options)).ideas; render(); } catch (e) { showError(e.message); }
  };
  function ideaEditor(i, isPt) {
    const title = h('input', { type: 'text', maxlength: 160, value: i.title, id: 'ie-title' });
    const details = h('textarea', { maxlength: 2000, id: 'ie-details' }, i.details);
    const tier = h('select', { id: 'ie-tier' }, IDEA_TIERS.map(([k, l]) => h('option', { value: k, ...(k === i.tier ? { selected: true } : {}) }, l)));
    const note = h('textarea', { maxlength: 2000, id: 'ie-note', placeholder: 'Thanks, Molly. This is in the next build.' }, i.note);
    const form = h('form', { class: 'card stack', onsubmit: e => {
      e.preventDefault();
      actIdea('/' + i.id, patch({ title: title.value, details: details.value, tier: tier.value, ...(isPt ? { note: note.value } : {}) }));
    } },
      h('div', {}, h('label', { for: 'ie-title' }, 'Idea'), title),
      h('div', {}, h('label', { for: 'ie-details' }, 'Details'), details),
      h('div', {}, h('label', { for: 'ie-tier' }, 'How much does it matter?'), tier),
      h('div', {}, h('label', {}, 'Screenshots'), h('p', { class: 'meta', style: 'margin-bottom:8px' }, 'Adding or removing a screenshot saves right away.'),
        shotList(i, id => keepEditing('/' + i.id + '/images/' + id, { method: 'DELETE' })),
        i.images.length < MAX_SHOTS && h('div', { style: 'margin-top:8px' }, shotPicker('ie-shots', MAX_SHOTS - i.images.length, files =>
          addShots(files, MAX_SHOTS - i.images.length, async blob => { state.ideas = (await uploadShot(i.id, blob)).ideas; render(); })))),
      isPt && h('div', {}, h('label', { for: 'ie-note' }, 'Reply to ' + i.client_name + ' (they see this)'), note),
      h('div', { class: 'row' }, h('button', { class: 'btn', type: 'submit' }, 'Save'), h('button', { class: 'btn ghost', type: 'button', onclick: () => { state.ideaEditing = null; render(); } }, 'Cancel')));
    form.addEventListener('paste', e => {
      const files = pastedImages(e);
      if (!files.length) return;
      e.preventDefault();
      addShots(files, MAX_SHOTS - i.images.length, async blob => { state.ideas = (await uploadShot(i.id, blob)).ideas; render(); });
    });
    return form;
  }

  // ---- The bell: what changed for this person. A client's people read /api/notifications; Positive Tribes'
  // bell is the command center Inbox (same items, same Clear), so there is only one list to keep up with. ----
  const bell = (() => {
    const KIND_WORD = { question: 'question', change: 'suggested change', problem: 'test problem', request: 'support request', idea: 'hub idea', release: 'phase' };
    const DOC_WORD = { proposal: 'proposal', agreement: 'agreement', test_script: 'test script', design: 'design', other: 'document' };
    const q = t => '“' + t + '”';
    let data = null, loadedAt = 0, timer = null, loadedFor = '';
    // Whose bell it is: Positive Tribes' Inbox, a previewed person's, or one's own.
    const whose = () => isPt() ? 'pt' : state.preview ? 'as:' + state.preview.email : 'me';
    const isPt = () => state.me.user.role === 'pt' && !state.preview;
    const panel = () => $('bell-panel');
    const isOpen = () => !panel().hidden;

    const ago = at => {
      const mins = Math.round((Date.now() - Date.parse(at)) / 60000);
      if (mins < 1) return 'just now';
      if (mins < 60) return mins + ' min ago';
      if (mins < 24 * 60) return Math.round(mins / 60) + ' h ago';
      const days = Math.round(mins / 1440);
      return days === 1 ? 'yesterday' : days < 7 ? days + ' days ago' : new Date(at).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    };
    const done = i => DONE_WORD[i.kind] || 'done';
    // One plain sentence per notification, for the client's people.
    function clientText(i) {
      const who = i.actor || 'Someone';
      switch (i.action) {
        case 'added': return i.kind === 'question' ? `${who} asked a question: ${q(i.title)}` : `${who} added a ${KIND_WORD[i.kind] || 'item'} to your list: ${q(i.title)}`;
        case 'answered': return `${who} answered ${q(i.title)}`;
        case 'done': return `${who} marked ${q(i.title)} ${done(i)}`;
        case 'reopened': return `${who} reopened ${q(i.title)}`;
        case 'phase': return `${q(i.title)} moved to ${(i.detail.split('→')[1] || i.detail).trim()}`;
        case 'signed_off': return `${who} signed off ${i.title}`;
        case 'uat_started': return `${i.title} is ready for you to test`;
        case 'live': return `${i.title} is live`;
        case 'shared': return `New ${DOC_WORD[i.detail] || 'document'} shared with you: ${q(i.title)}`;
        case 'idea_status': return `Positive Tribes replied to your hub idea ${q(i.title)}`;
        case 'triaged': return `${who} sorted your request ${q(i.title)}`;
        case 'confirmed': return `${who} confirmed ${q(i.title)}`;
        case 'declined': return `${who} chose not to go ahead with ${q(i.title)}`;
        case 'shipped': return `${q(i.title)} is live`;
        case 'cancelled': return `${who} cancelled ${q(i.title)}`;
        case 'care_question': return `Positive Tribes has a question about your request ${q(i.title)}`;
        case 'care_answered': return `${who} answered the question about ${q(i.title)}`;
        default: return q(i.title);
      }
    }
    const clientDetail = i => ['answered', 'idea_status', 'triaged', 'confirmed', 'shipped', 'cancelled', 'care_question', 'care_answered'].includes(i.action) || (i.action === 'added' && i.kind === 'question') ? i.detail : '';
    // Inbox rows, for Positive Tribes.
    function ptText(i) {
      const who = i.actor || 'Someone';
      const verb = {
        added: i.kind === 'idea' ? `suggested a hub idea ${q(i.title)}` : i.kind === 'question' ? `asked ${q(i.title)}` : `added a ${KIND_WORD[i.kind] || 'item'} ${q(i.title)}`,
        answered: `answered ${q(i.title)}`, done: `marked ${q(i.title)} ${done(i)}`, reopened: `reopened ${q(i.title)}`,
        signed_off: `signed off ${i.title}`, edited: `edited ${q(i.title)}`, tier: `changed the priority of ${q(i.title)}`,
        phase: `moved ${q(i.title)}`, deleted: `deleted ${q(i.title)}`,
        triaged: `sorted the care request ${q(i.title)}`, confirmed: `confirmed ${q(i.title)}`, declined: `chose not to go ahead with ${q(i.title)}`,
        shipped: `shipped ${q(i.title)}`, cancelled: `cancelled ${q(i.title)}`,
        care_question: `asked the client about ${q(i.title)}`, care_answered: `answered the question on ${q(i.title)}`
      }[i.action] || `changed ${q(i.title)}`;
      return `${who} ${verb}` + (i.eventIds.length > 1 ? ` (${i.eventIds.length} changes)` : '');
    }
    function reminderText(r) {
      if (r.type === 'questions') return `${r.count} must-answer question${r.count === 1 ? ' is' : 's are'} waiting for your team`;
      const when = r.daysLeft === 0 ? 'today' : r.daysLeft === 1 ? 'tomorrow' : 'in ' + r.daysLeft + ' days';
      return `${r.title} testing ends ${when}` + (r.autoAccept ? ', then it is accepted automatically unless problems are listed' : '');
    }

    function paint() {
      const count = !data ? 0 : isPt() ? data.items.length : data.unread;
      $('bell-count').textContent = count > 99 ? '99+' : String(count);
      $('bell-count').hidden = !count;
      $('bell').setAttribute('aria-label', count ? `Notifications, ${count} ${isPt() ? 'new' : 'unread'}` : 'Notifications');
      if (isOpen()) drawPanel();
    }

    function drawPanel() {
      const p = panel();
      if (!data) { p.replaceChildren(h('p', { class: 'bp-empty' }, 'Loading…')); return; }
      const pt = isPt(), preview = Boolean(state.preview);
      const items = data.items.slice(0, 15);
      const row = (i, n) => {
        const text = pt ? ptText(i) : clientText(i);
        const detail = pt ? i.detail : clientDetail(i);
        const meta = [pt ? i.client : '', ago(i.at)].filter(Boolean).join(' · ');
        const unread = pt || !i.read;
        return h('li', { class: unread ? 'unread' : '' },
          h('a', { class: 'bp-row', href: i.url, onclick: () => { open(false); if (!pt && !i.read && !preview) markRead([i.id]); } },
            h('span', { class: 'bp-dot', 'aria-hidden': 'true' }),
            h('span', { class: 'bp-body' },
              h('span', { class: 'bp-text' }, unread && !pt ? h('span', { class: 'visually-hidden' }, 'Unread: ') : null, text),
              detail ? h('p', { class: 'bp-detail' }, detail) : null,
              h('div', { class: 'bp-meta' }, meta))),
          pt ? h('div', { class: 'bp-actions' }, h('button', { class: 'bp-link', type: 'button', onclick: () => clearInbox([i]) }, 'Clear')) : null);
      };
      const reminders = pt ? [] : data.reminders.map(r => h('li', { class: 'bp-pin' },
        h('a', { class: 'bp-row', href: r.url, onclick: () => open(false) }, h('span', { class: 'bp-dot', 'aria-hidden': 'true' }), h('span', { class: 'bp-body' }, h('span', { class: 'bp-text' }, reminderText(r))))));
      const action = pt || preview || !data.items.length ? null : h('div', { class: 'bp-acts' },
        data.unread ? h('button', { class: 'bp-link', type: 'button', onclick: () => markRead('all') }, 'Mark all read') : null,
        h('button', { class: 'bp-link', type: 'button', onclick: () => markRead('all', true) }, 'Clear all'));
      const empty = pt ? 'Nothing new from clients.' : 'You’re all caught up.';
      // replaceChildren would print a null as the word "null", so empty parts are dropped first.
      p.replaceChildren(...[
        h('div', { class: 'bp-head' }, h('h2', {}, preview ? state.preview.name + '’s notifications' : 'Notifications'), action),
        reminders.length || items.length ? h('ul', {}, ...reminders, ...items.map(row)) : h('p', { class: 'bp-empty' }, empty),
        pt ? h('div', { class: 'bp-foot' }, h('a', { href: '#/command/inbox', onclick: () => open(false) }, data.items.length > items.length ? `See all ${data.items.length} in the Inbox` : 'Open the Inbox')) : null].filter(Boolean));
    }

    async function load() {
      if (!state.me) return;
      try {
        data = isPt() ? await api('/admin/inbox')
          : state.preview ? await api(base() + '/notifications?as=' + encodeURIComponent(state.preview.email))
          : state.me.user.role === 'pt' ? null : await api('/notifications');
        loadedAt = Date.now(); loadedFor = whose();
      } catch { /* The bell never gets in the way of the page. */ }
      paint();
    }
    // Read keeps a notification in the list; clear takes it out for good.
    async function markRead(ids, clear = false) {
      try { data = await api('/notifications/' + (clear ? 'clear' : 'read'), { method: 'POST', body: JSON.stringify(ids === 'all' ? { all: true } : { ids }) }); paint(); } catch (e) { showError(e.message); }
    }
    async function clearInbox(rows) {
      try {
        await api('/admin/inbox/clear', { method: 'POST', body: JSON.stringify({ items: rows.map(i => ({ backlog: i.backlog, eventIds: i.eventIds })) }) });
        await load();
        // The Inbox tab shows the same list, so it follows.
        const badge = $('cc-inbox-count');
        if (badge) badge.textContent = data && data.items.length ? String(data.items.length) : '';
        if (command && /^#\/command\/inbox/.test(location.hash)) command.refresh();
      } catch (e) { showError(e.message); }
    }
    function open(show) {
      panel().hidden = !show;
      $('bell').setAttribute('aria-expanded', String(show));
      if (show) { drawPanel(); if (Date.now() - loadedAt > 15000) load(); }
    }
    $('bell').addEventListener('click', e => { e.stopPropagation(); open(!isOpen()); });
    document.addEventListener('click', e => { if (isOpen() && !$('bell-wrap').contains(e.target)) open(false); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && isOpen()) { open(false); $('bell').focus(); } });
    document.addEventListener('visibilitychange', () => { if (!document.hidden && Date.now() - loadedAt > 30000) load(); });
    // The command center's Inbox tells the bell when it clears something.
    window.addEventListener('hub-inbox-changed', () => { if (isPt()) load(); });
    return {
      start() {
        // Positive Tribes previewing nobody in a client workspace still sees its own Inbox here.
        $('bell-wrap').hidden = false;
        load();
        clearInterval(timer);
        timer = setInterval(() => { if (!document.hidden) load(); }, 120000);
      },
      // After a route or preview change: the preview changes whose bell this is.
      refresh(force = false) {
        if (force || loadedFor !== whose()) { data = null; paint(); load(); }
        else if (Date.now() - loadedAt > 30000) load();
      }
    };
  })();

  $('switch').addEventListener('change', e => {
    location.hash = e.target.value === COMMAND ? '#/command' : '#/' + e.target.value + '/home';
  });
  function setPreview(email) {
    state.preview = state.people.find(u => u.email === email) || null;
    Object.assign(state, { editing: null, confirming: null, signing: null, ideaEditing: null });
    showError('');
    render();
    bell.refresh(true);
  }
  $('preview').addEventListener('change', e => setPreview(e.target.value));
  window.addEventListener('hashchange', () => { if (state.me) { route(); bell.refresh(); } });
  document.addEventListener('visibilitychange', async () => {
    if (document.hidden || !state.client || state.editing || state.mode === COMMAND) return;
    try { state.items = (await api(base() + '/items')).items; render(); } catch {}
  });
  (async () => {
    try { state.me = await api('/me'); bell.start(); await route(); }
    catch (e) { $('main').replaceChildren(h('div', { class: 'card stack' }, h('h2', {}, 'We couldn’t open your workspace'), h('p', { class: 'muted' }, e.message))); }
  })();
})();
</script>
</body>
</html>
