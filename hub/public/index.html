<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Your Positive Tribes workspace</title>
<link rel="icon" href="/brand/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
:root{
  --bg:#f7f6ef; --card:#fffdf8; --soft:#e9eddf; --ink:#243f36; --muted:#59665e; --line:#d9dfd4; --rust:#a94c32;
  --client:#a94c32;
  --must:#a3283a; --must-bg:#f7dde1; --nice:#8a5a00; --nice-bg:#f8ebc9; --idea:#3d5a80; --idea-bg:#dde6f1; --ok:#22693f; --ok-bg:#dbefe2;
  --display:'Fraunces',Georgia,serif; --font:'DM Sans',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  --shadow:0 1px 2px rgba(36,63,54,.06),0 8px 24px -12px rgba(36,63,54,.18); color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141b18; --card:#1b2420; --soft:#22302a; --ink:#e6ebe3; --muted:#a3b0a8; --line:#33423b; --rust:#e08a6d;
  --must:#f39aa7; --must-bg:#3e1f27; --nice:#efc36a; --nice-bg:#3a2f15; --idea:#9dbbe0; --idea-bg:#1f2b3a; --ok:#8fd1a6; --ok-bg:#183223;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141b18; --card:#1b2420; --soft:#22302a; --ink:#e6ebe3; --muted:#a3b0a8; --line:#33423b; --rust:#e08a6d;
  --must:#f39aa7; --must-bg:#3e1f27; --nice:#efc36a; --nice-bg:#3a2f15; --idea:#9dbbe0; --idea-bg:#1f2b3a; --ok:#8fd1a6; --ok-bg:#183223;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none !important}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 var(--font);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--rust);outline-offset:2px}
h1,h2,h3{margin:0;font-family:var(--display);font-weight:500;line-height:1.15;text-wrap:balance}
p{margin:0}
.shell{max-width:1080px;margin-inline:auto;padding:0 16px 64px}
.shell,.card,.stack>*{min-width:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:20px;text-decoration:none;color:var(--ink)}
.brand svg{width:30px;height:30px}.brand circle{fill:currentColor}.brand .core{fill:var(--client)}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.who{color:var(--muted);font-size:15px}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.bell-wrap{position:relative}
.bell{position:relative;display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);cursor:pointer}
.bell svg{width:22px;height:22px}
.idea-btn{display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font-size:15px;font-weight:600;text-decoration:none;white-space:nowrap}
.idea-btn:hover{border-color:var(--ink)}
.idea-btn svg{width:20px;height:20px;flex:none}
.idea-btn[aria-current=page]{border-color:var(--client);box-shadow:inset 0 -3px 0 var(--client)}
.idea-btn .badge{margin-left:2px}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;padding:0;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.icon-btn:hover{border-color:var(--ink)}
.icon-btn svg{width:20px;height:20px}
.theme-moon{display:none}
:root[data-theme=dark] .theme-sun{display:none}:root[data-theme=dark] .theme-moon{display:block}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .theme-sun{display:none}:root:not([data-theme=light]) .theme-moon{display:block}}
@media (max-width:720px){.idea-btn .idea-text{display:none}.idea-btn{padding:0 11px}}
.bell[aria-expanded=true]{border-color:var(--ink)}
.bell-count{position:absolute;top:-6px;right:-6px;min-width:20px;padding:0 5px;border-radius:10px;background:var(--rust);color:#fff;font-size:12px;font-weight:700;line-height:20px;text-align:center}
.bell-panel{position:absolute;right:0;top:calc(100% + 8px);z-index:30;width:min(420px,calc(100vw - 28px));max-height:min(70vh,560px);overflow-y:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 32px -8px rgba(0,0,0,.28);font-size:15px}
.bell-panel .bp-head{position:sticky;top:0;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line)}
.bell-panel .bp-head h2{font-size:18px;margin:0}
.bell-panel .bp-link{background:none;border:0;padding:6px 0;color:var(--ink);font:inherit;font-size:14px;font-weight:600;text-decoration:underline;cursor:pointer;min-height:32px}
.bell-panel .bp-acts{display:flex;gap:14px}
.bell-panel ul{list-style:none;margin:0;padding:0}
.bell-panel li{border-bottom:1px solid var(--line)}
.bell-panel li:last-child{border-bottom:0}
.bell-panel .bp-row{display:flex;gap:10px;align-items:flex-start;padding:12px 16px;color:var(--ink);text-decoration:none}
.bell-panel a.bp-row:hover{background:var(--soft)}
.bell-panel .bp-dot{flex:none;width:9px;height:9px;margin-top:8px;border-radius:50%;background:transparent}
.bell-panel .unread .bp-dot{background:var(--rust)}
.bell-panel .unread .bp-text{font-weight:600}
.bell-panel .bp-body{flex:1;min-width:0;overflow-wrap:anywhere}
.bell-panel .bp-detail{margin:2px 0 0;color:var(--muted);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bell-panel .bp-meta{margin-top:2px;color:var(--muted);font-size:13px}
.bell-panel .bp-actions{display:flex;justify-content:flex-end;padding:0 16px 8px;margin-top:-6px}
.bell-panel .bp-pin{background:var(--soft)}
.bell-panel .bp-empty{padding:20px 16px;color:var(--muted);margin:0}
.bell-panel .bp-foot{padding:10px 16px;border-top:1px solid var(--line);text-align:center}
.hero{padding:18px 0 22px;border-bottom:1px solid var(--line);margin-bottom:6px;position:relative}
.eyebrow .eb-sf{color:var(--muted);text-decoration:none;border-bottom:1px solid transparent}
.eyebrow .eb-sf:hover,.eyebrow .eb-sf:focus-visible{color:var(--ink);border-bottom-color:var(--client)}
.hero:before{content:"";display:block;width:56px;height:5px;border-radius:3px;background:var(--client);margin-bottom:14px}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
h1{font-size:clamp(30px,6vw,44px);margin-top:4px}
/* In a client workspace the name is a label; the testing countdown below it is what people come for. */
.hero.ws{padding:12px 0 16px}.hero.ws h1{font-size:clamp(26px,4.5vw,36px)}
/* The client's logo mark sits on a white tile so dark marks stay visible in dark mode. */
.ws-name{display:flex;align-items:center;gap:14px;margin-top:4px}.ws-name h1{margin-top:0}
.ws-logo{width:48px;height:48px;flex:none;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:12px;padding:5px}
nav.tabs{display:flex;gap:4px;margin:6px 0 22px;overflow-x:auto}
nav.tabs a{padding:12px 16px;text-decoration:none;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs a[aria-current=page]{color:var(--ink);border-color:var(--client)}
.badge{display:inline-block;min-width:20px;margin-left:6px;padding:0 6px;border-radius:10px;background:var(--ink);color:var(--bg);font-size:12px;line-height:20px;text-align:center}
.stack{display:flex;flex-direction:column;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
.btn{display:inline-block;border:1px solid var(--ink);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-weight:600;text-decoration:none;min-height:44px}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.small{padding:6px 12px;min-height:36px;font-size:15px}
.btn.danger{color:var(--must);border-color:var(--must)}
.btn:disabled{opacity:.45;cursor:default}
.muted{color:var(--muted)}
.meta{font-size:14px;color:var(--muted)}
.error{background:var(--must-bg);color:var(--must);border-radius:10px;padding:10px 14px;font-weight:600}
.preview-bar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;margin:0 0 8px;font-size:15px}
.preview-bar b{font-weight:700}
.preview-bar button{background:var(--bg);color:var(--ink);border:0;border-radius:8px;padding:6px 12px;font-weight:700;min-height:36px;cursor:pointer}
/* Home */
.next{border-left:6px solid var(--client);display:flex;flex-direction:column;gap:10px}
.next h2{font-size:clamp(24px,4.5vw,32px)}
.label{font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--rust)}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr))}
/* A project with several client phases spans the row, its phases side by side; the others sit beneath. */
.grid>.card.wide{grid-column:1/-1}
.card.wide .steps-wrap{max-width:620px}
.card.wide .releases{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(190px,100%),1fr));gap:12px 0}
.card.wide .releases li{border-top:0;padding:0 14px;border-left:1px solid var(--line)}
.card.wide .releases li:first-child{border-left:0;padding-left:0}
.card.wide .rel-head{flex-direction:column;gap:6px}
.proj-foot{display:flex;flex-direction:column;gap:8px}.proj-foot:empty{display:none}
.card.wide .proj-foot{flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px 18px;border-top:1px solid var(--line);margin-top:14px;padding-top:12px}
.proj-foot p{margin:0}
/* When nothing waits on the client, and when every system is up, each is one quiet line. */
.next.caught{flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;padding-top:14px;padding-bottom:14px}
.next.caught p{margin:0}
.status-line>summary{cursor:pointer;list-style:none;display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}
.status-line>summary::-webkit-details-marker{display:none}
.status-line>summary:focus:not(:focus-visible){outline:none}
.status-line>summary .ok-dot{width:10px;height:10px;border-radius:50%;background:#2e8b57;flex:none}
.status-line>summary .more{margin-left:auto;font-size:14px;color:var(--muted);text-decoration:underline;text-underline-offset:2px}
.status-line[open]>summary .more{display:none}
.status-line .docs{margin-top:10px}
.steps{display:flex;gap:0;margin:12px 0 4px;list-style:none;padding:0}
.steps li{flex:1;min-width:0;text-align:center;font-size:12px;color:var(--muted);position:relative;padding-top:22px;line-height:1.2;white-space:nowrap}
.steps li span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.steps li.now span{position:static;width:auto;height:auto;clip:auto;overflow:visible;display:block;margin-top:2px}
/* Hover or tap any other dot to see which part of the process it is. */
.steps li:not(.now){cursor:default}
.steps li:not(.now):hover span,.steps li:not(.now):focus-visible span{width:auto;height:auto;clip:auto;overflow:visible;bottom:calc(100% - 2px);left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:4px 10px;border-radius:6px;font-size:13px;font-weight:600;z-index:2;box-shadow:var(--shadow)}
.steps li:first-child:not(.now):hover span,.steps li:first-child:not(.now):focus-visible span{left:0;transform:none}
.steps li:last-child:not(.now):hover span,.steps li:last-child:not(.now):focus-visible span{left:auto;right:0;transform:none}
.steps li:not(.now):focus-visible{outline:none}
.steps li:not(.now):focus-visible:before{outline:3px solid var(--rust);outline-offset:2px}
.steps li:before{content:"";position:absolute;top:5px;left:50%;width:12px;height:12px;border-radius:50%;background:var(--line);transform:translateX(-50%);z-index:1}
.steps li:after{content:"";position:absolute;top:10px;left:-50%;width:100%;height:2px;background:var(--line)}
.steps li:first-child:after{display:none}
.steps li.done:before,.steps li.done:after,.steps li.now:after{background:var(--client)}
.steps li.done:before{background:var(--client)}
.steps li.now:before{background:var(--card);border:3px solid var(--client);width:16px;height:16px;top:3px}
.steps li.now{color:var(--ink);font-weight:700;overflow:visible;font-size:13px}
/* Testing countdown: a client phase in UAT, at most 30 days, then signed off. */
.uat{border-left:6px solid var(--client);display:flex;flex-wrap:wrap;align-items:center;gap:12px 28px}
.uat .left{font-family:var(--display);font-size:clamp(44px,9vw,64px);line-height:1;white-space:nowrap}
.uat.soon .left,.uat.late .left{color:var(--rust)}
.uat .left .unit{display:block;font-family:var(--font);font-size:15px;font-weight:600;color:var(--muted);margin-top:6px}
.uat .what{flex:1 1 260px;min-width:0;display:flex;flex-direction:column;gap:4px}
.uat .what h2{font-size:22px;font-family:var(--font);font-weight:700}
.uat .actions{flex-basis:100%}
.uat .actions .signoff{margin-left:auto}
.track{height:6px;border-radius:3px;background:var(--line);overflow:hidden;flex-basis:100%}
.track span{display:block;height:100%;background:var(--client)}
.uat.soon .track span,.uat.late .track span{background:var(--rust)}
.steps-wrap{position:relative;display:flow-root}
.doc-folder{border-top:1px solid var(--line);padding:10px 0}.doc-folder:first-of-type{border-top:0}
.doc-folder>summary{cursor:pointer;font-weight:700;font-size:16px}
.releases{list-style:none;margin:14px 0 0;padding:0;font-size:15px}
.releases li{padding:10px 0;border-top:1px solid var(--line)}
.releases li:first-child{border-top:0;padding-top:0}
.rel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.rel-name b{margin-right:8px}
.rel-sub{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;margin-top:4px}
.rel-sub .meta{margin:0}
.admin-link{font-size:14px;font-weight:600;color:var(--ink);text-decoration-color:var(--client);text-decoration:underline;text-underline-offset:2px}
.admin-only{margin:4px 0 0;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.pill.stage{background:var(--soft);color:var(--ink);text-transform:none;letter-spacing:0;font-weight:600}
.pill.stage.uat{background:var(--client);color:#fff}
.docs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.docs li{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 0;border-top:1px solid var(--line)}
.docs li:first-child{border-top:0;padding-top:4px}
.docs .doc-title{display:flex;flex-direction:column;gap:2px;flex:1 1 220px;min-width:0}
.docs .doc-title b{font-weight:650}
.pill.doc{text-transform:none;letter-spacing:0;font-weight:600;background:var(--soft);color:var(--ink)}
.pill.doc.signed{background:var(--ok-bg);color:var(--ok)}
.pill.sys{text-transform:none;letter-spacing:0;font-weight:600;background:var(--soft);color:var(--ink)}.pill.sys.up{background:var(--ok-bg);color:var(--ok)}.pill.sys.down{background:var(--must-bg);color:var(--must)}
.shots{display:flex;gap:8px;flex-wrap:wrap}
.shot{position:relative;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.shot button.thumb{padding:0;border:1px solid var(--line);border-radius:8px;background:var(--soft);overflow:hidden;width:132px;height:88px;display:block}
.shot button.thumb:hover{border-color:var(--ink)}
.shot img{width:100%;height:100%;object-fit:cover;object-position:top left;display:block}
.drop{border:2px dashed var(--line);border-radius:10px;padding:10px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:15px;color:var(--muted)}
.drop.over{border-color:var(--client);background:color-mix(in srgb,var(--client) 8%,transparent)}
.drop input[type=file]{position:absolute;width:1px;height:1px;opacity:0}
.drop label{margin:0}
dialog.shot-view{border:0;padding:0;background:transparent;max-width:min(1200px,96vw);max-height:94vh}
dialog.shot-view::backdrop{background:rgba(10,15,13,.82)}
dialog.shot-view img{display:block;max-width:100%;max-height:86vh;border-radius:10px;margin-inline:auto}
dialog.shot-view .bar{justify-content:flex-end;margin-bottom:8px}
.pill.idea-status{text-transform:none;letter-spacing:0;font-weight:600;background:var(--soft);color:var(--ink)}
.pill.idea-status.next{background:var(--client);color:#fff}.pill.idea-status.shipped{background:var(--ok-bg);color:var(--ok)}.pill.idea-status.declined{background:transparent;border:1px solid var(--line);color:var(--muted)}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.list li a{color:inherit;display:flex;gap:10px;align-items:baseline;padding:10px 4px;text-decoration:none;border-bottom:1px solid var(--line)}
.list li:last-child a{border-bottom:0}.list li a:hover{color:var(--rust)}
/* Backlog */
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px;flex-wrap:wrap;max-width:100%}
.seg button{border:0;background:none;padding:8px 14px;border-radius:9px;font-weight:600;min-height:40px}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.seg.small button{padding:4px 10px;min-height:32px;font-size:14px;font-weight:500}
.item-no{font-size:13px;font-weight:600;color:var(--muted);text-decoration:none;font-variant-numeric:tabular-nums}.item-no:hover{color:var(--ink);text-decoration:underline}
.pill{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 10px;border-radius:99px;white-space:nowrap}
.pill.must{background:var(--must-bg);color:var(--must)}.pill.nice{background:var(--nice-bg);color:var(--nice)}.pill.idea{background:var(--idea-bg);color:var(--idea)}.pill.done{background:var(--ok-bg);color:var(--ok)}
.pill.est{text-transform:none;letter-spacing:0;font-weight:600}.pill.est.draft{background:var(--nice-bg);color:var(--nice)}.pill.est.sent{background:var(--idea-bg);color:var(--idea)}.pill.est.yes{background:var(--ok-bg);color:var(--ok)}.pill.est.quiet{background:transparent;border:1px solid var(--line);color:var(--muted)}
.pill.phase{background:transparent;border:1px solid var(--line);color:var(--muted);text-transform:none;letter-spacing:0;font-weight:500}
.seg .n{display:inline-block;margin-left:6px;min-width:20px;padding:0 6px;border-radius:99px;background:var(--soft);color:var(--ink);font-size:12px;line-height:20px;text-align:center}
.seg button[aria-pressed=true] .n{background:var(--bg);color:var(--ink)}
.seg button.zero:not([aria-pressed=true]){color:var(--muted);font-weight:500}
.show-by{display:flex;align-items:center;gap:8px}.show-by label{margin:0;font-weight:500;color:var(--muted)}
.show-by select{width:auto;min-height:36px;padding:5px 30px 5px 10px;font-size:15px}
.pill.status{text-transform:none;letter-spacing:0;font-weight:600;background:var(--soft);color:var(--ink)}
.pill.status.built{background:var(--client);color:#fff}.pill.status.declined{background:transparent;border:1px solid var(--line);color:var(--muted)}
.pill.status.reply{background:var(--must-bg);color:var(--must)}
.status-pick{width:auto;min-height:32px;padding:3px 28px 3px 10px;font-size:14px}
details.wishlist{border-top:1px solid var(--line);padding-top:12px}
details.wishlist>summary{cursor:pointer;font-family:var(--display);font-size:22px;font-weight:600;padding:4px 0}
details.wishlist .why{margin:4px 0 12px;color:var(--muted);font-size:15px}
details.wishlist h3.sub{font-size:16px;font-family:var(--font);font-weight:600;margin:6px 0 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tier .meaning{font-family:var(--font);font-size:14px;color:var(--muted);font-weight:400}
.answer p.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.answer .show-all{border:0;background:none;padding:4px 0 0;font-weight:600;font-size:14px;color:var(--ink);text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.item .who{font-size:15px;color:var(--muted)}.item .who b{color:var(--ink);font-weight:600}
details.more-actions{flex-basis:100%}
details.more-actions>summary{cursor:pointer;list-style:none;display:inline-block;font-size:14px;font-weight:600;color:var(--muted);padding:4px 0}
details.more-actions>summary::-webkit-details-marker{display:none}
details.more-actions>summary:hover{color:var(--ink)}

    }
    return h('div', { class: 'stack' }, nodes);
  }

  // ---- Change estimates: Positive Tribes enters hours; everyone on the hub sees the price; the director decides ----
  async function reloadItems() { state.items = (await api(base() + '/items')).items; }
  // errorBox: an element inside the estimate form, so a refused save is shown where Eric is looking, not at the page top.
  async function estimateAct(item, action, method, payload, errorBox) {
    const fail = message => { if (errorBox) { errorBox.textContent = message; errorBox.hidden = !message; } else showError(message); };
    fail('');
    try {
      await api('/admin/items/' + item.id + '/estimate' + (action ? '/' + action : ''), { method, body: JSON.stringify(payload || {}) });
      if (action !== 'retry-task') { state.estimating = null; state.estLinesFor = null; }
      await reloadItems(); render();
    } catch (e) { fail(e.message); }
  }
  async function decideEstimate(item, choice) {
    showError('');
    try {
      const data = await api(base() + '/items/' + item.id + '/estimate/decide', post({ choice, version: item.estimate.version }));
      state.items = data.items; render();
    } catch (e) { showError(e.message); try { await reloadItems(); render(); } catch {} }
  }
  // The estimate at a glance, in the card's top row. No pill means no estimate (many changes never need one).
  // A draft or a withdrawn estimate is Positive Tribes' alone, so clients never get those pills.
  function estimatePill(item) {
    const e = item.estimate;
    // Covered by the signed agreement: no separate price. Everyone sees which requirement covers it.
    if (item.kind === 'change' && item.agreement_ref && (!e || e.status === 'withdrawn')) return h('span', { class: 'pill est yes', title: 'Covered by the signed agreement, requirement ' + item.agreement_ref }, 'In the agreement · ' + item.agreement_ref);
    if (item.kind !== 'change' || !e) return null;
    if (e.status === 'offered') {
      const days = e.offered_at ? Math.floor((Date.now() - Date.parse(e.offered_at.replace(' ', 'T') + 'Z')) / 864e5) : 0;
      return h('span', { class: 'pill est sent' }, 'Estimate sent · ' + (days > 0 ? days + (days === 1 ? ' day' : ' days') : 'today'));
    }
    const [cls, words] = {
      draft: ['draft', 'Draft estimate'], withdrawn: ['quiet', 'Estimate withdrawn'], not_now: ['quiet', 'Estimate: not now'],
      approved_now: ['yes', e.donated ? 'Approved · donated' : 'Approved · ' + e.price_label], approved_later: ['yes', 'Approved for after launch']
    }[e.status] || [];
    return words ? h('span', { class: 'pill est ' + cls }, words) : null;
  }
  // Which estimate state a card is in, for Positive Tribes' "Estimate" filter.
  const ESTIMATE_FILTERS = [['all', 'Any'], ['none', 'Not estimated'], ['covered', 'In the agreement'], ['draft', 'Draft'], ['sent', 'Sent, waiting'], ['decided', 'Decided']];
  const estimateStage = item => {
    const s = item.estimate ? item.estimate.status : '';
    if (item.agreement_ref && (!s || s === 'withdrawn')) return 'covered';
    return !s || s === 'withdrawn' ? 'none' : s === 'draft' ? 'draft' : s === 'offered' ? 'sent' : 'decided';
  };

  // Time Positive Tribes gave on this card without an estimate. Everyone on the client's hub sees it.
  function donatedBlock(item) {
    const list = item.donated_time || [], ptNow = viewer().role === 'pt' && !state.preview;
    const nodes = list.map(d => h('p', { class: 'meta' }, h('b', {}, 'Donated by Positive Tribes: '), d.hours_label + ' (' + d.value_label + ' value)', d.note ? ' · ' + d.note : '',
      ptNow && ' ', ptNow && h('button', { class: 'btn ghost small', type: 'button', onclick: () => donatedAct('/admin/donated-time/' + d.id, 'DELETE') }, 'Remove')));
    if (ptNow && state.giving === item.id) {

  }
  async function donatedAct(path, method, payload) {
    showError('');

      state.giving = null;
      await reloadItems(); render();
    } catch (e) { showError(e.message); }
  }
  // Donated so far on one project: approved donated changes plus logged donated time.
  function donatedTotal(items) {
    let minutes = 0, cents = 0;
    for (const i of items) {

      (hrs === 1 ? '1 hour' : (Number.isInteger(hrs) ? hrs : hrs.toFixed(1)) + ' hours') + ' · $' + dollars.toLocaleString('en-US', { maximumFractionDigits: 2 }) + ' value');
  }

  function estimateBlock(item) {
    if (item.kind !== 'change' || item.done) return null;

      if (e.status === 'offered') {

          nodes.push(h('div', { class: 'actions' },

          nodes.push(h('p', { class: 'meta' }, e.donated ? 'Positive Tribes covers this one: adding it puts it into the build, with nothing on your invoice.' : 'Adding it now puts ' + e.price_label + ' on your next invoice and into the build.' + (e.later_ok ? ' After launch uses ' + e.credits_label + ' from your care plan.' : '')));
          if (e.later_note) nodes.push(h('p', { class: 'meta' }, e.later_note));
        } else nodes.push(h('p', { class: 'meta' }, ptNow ? 'Waiting for the client’s director to decide.' : 'Your director decides whether to add this.'));
      } else {
        const words = { approved_now: 'Added to the build · ' + (e.donated ? 'donated (' + e.price_label + ' value)' : e.price_label), approved_later: 'Planned for after launch · ' + e.credits_label, not_now: 'Not now: it stays on the wishlist' }[e.status];
        nodes.push(h('p', {}, h('b', {}, words), e.decided_by ? ' · ' + e.decided_by : '', e.decided_at ? ', ' + shortDate(e.decided_at.slice(0, 10)) : ''));
      }
    }
    if (ptNow) {
      if (e && e.sf_error) nodes.push(h('p', { class: 'meta' }, 'The Salesforce Task did not save: ' + e.sf_error + ' ',
        h('button', { class: 'btn ghost small', type: 'button', onclick: () => estimateAct(item, 'retry-task', 'POST') }, 'Try again')));
      if (e && ['approved_now', 'approved_later'].includes(e.status) && !e.handled_at) nodes.push(h('div', { class: 'actions' },
        h('button', { class: 'btn ghost small', type: 'button', onclick: () => estimateAct(item, 'handled', 'POST') }, 'Billed and scheduled')));
      if (e && e.status === 'draft') nodes.unshift(h('b', {}, 'Draft estimate (only you see it)'), summary(), ...notes(), h('p', { class: 'meta' }, 'Rate ' + e.rate_label + '.'));
      if (e && e.status === 'withdrawn') nodes.unshift(h('b', {}, 'Estimate withdrawn'));
      const decided = e && ['approved_now', 'approved_later'].includes(e.status);
      if (!decided) {
        if (state.estimating === item.id) {
          const hours = h('input', { type: 'number', min: 0.5, max: 200, step: 0.5, value: e ? e.hours : '', 'aria-label': 'Hours' });
          // The breakdown, in the client's words. With any lines, the hours are their sum.
          if (state.estLinesFor !== item.id) { state.estLinesFor = item.id; state.estLines = e ? e.lines.map(l => ({ label: l.label, hours: l.hours })) : []; }
          const rows = state.estLines;
          const sum = () => rows.reduce((n, l) => n + (Number(l.hours) || 0), 0);
          const totalNote = h('p', { class: 'meta' });
          const sync = () => { hours.disabled = rows.length > 0; if (rows.length) hours.value = sum(); totalNote.textContent = rows.length ? 'Total from the lines: ' + sum() + ' hours' : 'Add lines to show the client what the hours include (optional).'; };
          const lineEditor = h('div', { class: 'stack' },
            rows.map((l, n) => h('div', { class: 'line-row' },
              h('input', { type: 'text', maxlength: 120, value: l.label, placeholder: 'What the client gets', 'aria-label': 'Line ' + (n + 1), oninput: ev => { l.label = ev.target.value; } }),
              h('input', { type: 'number', min: 0.5, max: 200, step: 0.5, value: l.hours, 'aria-label': 'Hours for line ' + (n + 1), oninput: ev => { l.hours = ev.target.value; sync(); } }),
              h('button', { class: 'btn ghost small', type: 'button', 'aria-label': 'Remove line ' + (n + 1), onclick: () => { rows.splice(n, 1); render(); } }, 'Remove'))),

            totalNote);
          sync();
          const schedule = h('input', { type: 'text', maxlength: 200, value: e ? e.schedule_note : '', placeholder: 'Schedule impact, e.g. adds about a week', 'aria-label': 'Schedule impact' });
          const scope = h('input', { type: 'text', maxlength: 200, value: e ? e.scope_note : '', placeholder: 'Why it is outside the agreement (optional)', 'aria-label': 'Why it is outside the agreement' });
          const gift = h('input', { type: 'checkbox', ...(e && e.donated ? { checked: true } : {}) });
          const formError = h('p', { class: 'error', role: 'alert', hidden: true });
          const check = () => {
            if (!rows.length && !hours.value) return 'Enter the hours first.';
            for (let n = 0; n < rows.length; n++) {

              if (label.length > 120) return 'Line ' + (n + 1) + ' is ' + label.length + ' characters; shorten it to 120 or fewer.';

            }

          };
          nodes.push(h('div', { class: 'stack' }, h('label', {}, 'Hours ', hours), lineEditor, schedule, scope, h('label', {}, gift, ' Donate this (Positive Tribes covers it)'), formError, h('div', { class: 'actions' },
            h('button', { class: 'btn small', type: 'button', onclick: () => {
              const problem = check();
              if (problem) { formError.textContent = problem; formError.hidden = false; return; }
              estimateAct(item, '', 'PUT', { hours: Number(hours.value), lines: rows.map(l => ({ label: l.label, hours: Number(l.hours) })), schedule_note: schedule.value, scope_note: scope.value, donated: gift.checked }, formError);
            } }, 'Save estimate'),
            h('button', { class: 'btn ghost small', type: 'button', onclick: () => { state.estimating = null; state.estLinesFor = null; render(); } }, 'Cancel'))));

        }
      }
    }
    return nodes.length ? h('div', { class: 'estimate stack' }, nodes) : null;
  }

  // ---- System status: live up/down for the client's apps, from the status Worker ----
  function systemStatus() {

  // ---- Documents: proposals and other papers, as links ----
  const DOC_STATUS = { draft: 'Draft', sent: 'Sent', signed: 'Signed' };
  const DOC_KINDS = { proposal: 'Proposal', agreement: 'Agreement', test_script: 'Test script', design: 'Design', plan: 'Plan', process: 'Process', link: 'Link', other: 'Document' };
  const shortDocDate = iso => new Date(iso + 'T12:00:00').toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
  function documents() {
    // Positive Tribes receives hidden documents too; a preview shows only what the client would see.
    const isPt = viewer().role === 'pt';
    const docs = state.documents.filter(d => d.visible || isPt);
    if (!docs.length) return null;

      .map(f => ({ ...f, docs: docs.filter(d => (d.project_id || null) === f.id).sort(signedFirst) })).filter(f => f.docs.length);

  // ---- Client phases and their testing window ----
  const isLive = (p, phases) => Boolean(p.live_url) && (['launch', 'hypercare', 'support'].includes(p.phase) || phases.some(r => r.stage === 'live'));
  const phaseName = r => r.name || 'Phase ' + r.number;
  const longDate = iso => new Date(iso + 'T12:00:00').toLocaleDateString(undefined, { month: 'long', day: 'numeric', year: 'numeric' });
  const shortDate = iso => new Date(iso + 'T12:00:00').toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  // Days from today to iso: calendar days, or for business-day windows the weekdays still to come (weekends skipped).
  function daysUntil(iso, business) {
    const now = new Date();
    const [y, m, d] = iso.split('-').map(Number);
    const today = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()), end = Date.UTC(y, m - 1, d);
    const calendar = Math.round((end - today) / 86400000);
    if (!business || calendar <= 0) return calendar;
    let left = 0;
    for (let t = today + 86400000; t <= end; t += 86400000) if (new Date(t).getUTCDay() % 6 !== 0) left++;
    return left;
  }

  const ofTotal = r => { const n = state.releases.filter(x => x.project_id === r.project_id).length; return n > 1 ? phaseName(r) + ' of ' + n : ''; };
  function testing(r) {
    const project = state.projects.find(p => p.id === r.project_id);
    const business = r.uat_day_type === 'business';
    const left = r.uat_due ? daysUntil(r.uat_due, business) : null;
    const used = left == null ? 0 : Math.min(100, Math.max(0, (r.uat_days - left) / r.uat_days * 100));
    const waiting = state.releases.find(x => x.project_id === r.project_id && x.number > r.number && x.stage === 'waiting');
    const problems = open(state.items.filter(i => i.project_id === r.project_id && i.kind === 'problem'));
    const blocking = problems.filter(i => i.tier === 'must');
    // The big number counts the same days as the due line under it (business days for business-day windows).
    const unit = business ? ' business day' : ' day';
    // A count shows the number large with its words small beneath, so a long label does not crowd the card.
    const big = left == null ? 'Testing' : left === 0 ? 'Due today'
      : [h('span', {}, String(Math.abs(left))), h('span', { class: 'unit' }, unit.trim() + (Math.abs(left) === 1 ? '' : 's') + (left > 0 ? ' left' : ' over'))];
    // Under the agreement, a phase with auto_accept is accepted on its due date unless problems are listed by then.
    const acceptance = r.auto_accept && r.uat_due && (problems.length
      ? (problems.length === 1 ? 'A problem is' : problems.length + ' problems are') + ' listed, so ' + phaseName(r) + ' is accepted once ' + (problems.length === 1 ? 'it is' : 'they are') + ' fixed and signed off.'
      : 'No problems listed yet. ' + phaseName(r) + ' is accepted automatically on ' + shortDate(r.uat_due) + ' unless one is added by then.');
    const canSign = viewer().role !== 'staff';
    const confirming = state.signing === r.id;
    return h('div', { class: 'card uat' + (left != null && left < 0 ? ' late' : left != null && left <= 7 ? ' soon' : '') },
      h('div', { class: 'left' }, big),
      h('div', { class: 'what' },

        triaged: `sorted the care request ${q(i.title)}`, confirmed: `confirmed ${q(i.title)}`, declined: `chose not to go ahead with ${q(i.title)}`,
        shipped: `shipped ${q(i.title)}`, cancelled: `cancelled ${q(i.title)}`,
        care_question: `asked the client about ${q(i.title)}`, care_answered: `answered the question on ${q(i.title)}`,
        estimate_decided: `decided on the estimate for ${q(i.title)}: ${i.detail}`, estimate_offered: `was sent an estimate for ${q(i.title)}`,
        donated_time: `logged donated time on ${q(i.title)}: ${i.detail}`, covered: `marked ${q(i.title)}: ${i.detail}`
      }[i.action] || `changed ${q(i.title)}`;
      return `${who} ${verb}` + (i.eventIds.length > 1 ? ` (${i.eventIds.length} changes)` : '');
    }
    function reminderText(r) {
      if (r.type === 'questions') return `${r.count} must-answer question${r.count === 1 ? ' is' : 's are'} waiting for your team`;
      const when = r.daysLeft === 0 ? 'today' : r.daysLeft === 1 ? 'tomorrow' : 'in ' + r.daysLeft + ' days';
      return `${r.title} testing ends ${when}` + (r.autoAccept ? ', then it is accepted automatically unless problems are listed' : '');
    }

    function paint() {
      const count = !data ? 0 : isPt() ? data.items.length : data.unread;
      $('bell-count').textContent = count > 99 ? '99+' : String(count);
      $('bell-count').hidden = !count;
      $('bell').setAttribute('aria-label', count ? `Notifications, ${count} ${isPt() ? 'new' : 'unread'}` : 'Notifications');
      if (isOpen()) drawPanel();
    }

    function drawPanel() {
      const p = panel();
      if (!data) { p.replaceChildren(h('p', { class: 'bp-empty' }, 'Loading…')); return; }
      const pt = isPt(), preview = Boolean(state.preview);
      const items = data.items.slice(0, 15);
      const row = (i, n) => {
        const text = pt ? ptText(i) : clientText(i);
        const detail = pt ? i.detail : clientDetail(i);
        const meta = [pt ? i.client : '', ago(i.at)].filter(Boolean).join(' · ');
        const unread = pt || !i.read;
        return h('li', { class: unread ? 'unread' : '' },
          h('a', { class: 'bp-row', href: i.url, onclick: () => { open(false); if (!pt && !i.read && !preview) markRead([i.id]); } },
            h('span', { class: 'bp-dot', 'aria-hidden': 'true' }),
            h('span', { class: 'bp-body' },
              h('span', { class: 'bp-text' }, unread && !pt ? h('span', { class: 'visually-hidden' }, 'Unread: ') : null, text),
              detail ? h('p', { class: 'bp-detail' }, detail) : null,
              h('div', { class: 'bp-meta' }, meta))),
          pt ? h('div', { class: 'bp-actions' }, h('button', { class: 'bp-link', type: 'button', onclick: () => clearInbox([i]) }, 'Clear')) : null);
      };
      const reminders = pt ? [] : data.reminders.map(r => h('li', { class: 'bp-pin' },
        h('a', { class: 'bp-row', href: r.url, onclick: () => open(false) }, h('span', { class: 'bp-dot', 'aria-hidden': 'true' }), h('span', { class: 'bp-body' }, h('span', { class: 'bp-text' }, reminderText(r))))));
      const action = pt || preview || !data.items.length ? null : h('div', { class: 'bp-acts' },
        data.unread ? h('button', { class: 'bp-link', type: 'button', onclick: () => markRead('all') }, 'Mark all read') : null,
        h('button', { class: 'bp-link', type: 'button', onclick: () => markRead('all', true) }, 'Clear all'));
      const empty = pt ? 'Nothing new from clients.' : 'You’re all caught up.';
      const more = pt && data.items.length > items.length;
      const pp = (pt && data.patch) || {};
      const patchNote = pt && (pp.pending || (pp.demotions || []).length || (pp.answered || []).length || (pp.failedRuns || []).length) ? 'Patch needs a look' : '';
      // replaceChildren would print a null as the word "null", so empty parts are dropped first.
      p.replaceChildren(...[
        h('div', { class: 'bp-head' }, h('h2', {}, preview ? state.preview.name + '’s notifications' : 'Notifications'), action),
        reminders.length || items.length ? h('ul', {}, ...reminders, ...items.map(row)) : h('p', { class: 'bp-empty' }, empty),
        // The full list only has something the bell lacks when the bell is cut off at 15, or Patch needs a look.
        pt && (more || patchNote) ? h('div', { class: 'bp-foot' }, h('a', { href: '#/command/inbox', onclick: () => open(false) }, more ? `See all ${data.items.length}` + (patchNote ? ' · ' + patchNote : '') : patchNote)) : null].filter(Boolean));
    }

    async function load() {
      if (!state.me) return;
      try {
        data = isPt() ? await api('/admin/inbox')
          : state.preview ? await api(base() + '/notifications?as=' + encodeURIComponent(state.preview.email))
          : state.me.user.role === 'pt' ? null : await api('/notifications');
        loadedAt = Date.now(); loadedFor = whose();
      } catch { /* The bell never gets in the way of the page. */ }
      paint();
    }
    // Read keeps a notification in the list; clear takes it out for good.
    async function markRead(ids, clear = false) {
      try { data = await api('/notifications/' + (clear ? 'clear' : 'read'), { method: 'POST', body: JSON.stringify(ids === 'all' ? { all: true } : { ids }) }); paint(); } catch (e) { showError(e.message); }
    }
    async function clearInbox(rows) {
      try {
        await api('/admin/inbox/clear', { method: 'POST', body: JSON.stringify({ items: rows.map(i => ({ backlog: i.backlog, eventIds: i.eventIds })) }) });
        await load();
        // The Inbox tab shows the same list, so it follows.
        const badge = $('cc-inbox-count');
        if (badge) badge.textContent = data && data.items.length ? String(data.items.length) : '';
        if (command && /^#\/command\/inbox/.test(location.hash)) command.refresh();
      } catch (e) { showError(e.message); }
    }
    function open(show) {
      panel().hidden = !show;
      $('bell').setAttribute('aria-expanded', String(show));
      if (show) { drawPanel(); if (Date.now() - loadedAt > 15000) load(); }
    }
    $('bell').addEventListener('click', e => { e.stopPropagation(); open(!isOpen()); });
    document.addEventListener('click', e => { if (isOpen() && !$('bell-wrap').contains(e.target)) open(false); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && isOpen()) { open(false); $('bell').focus(); } });
    document.addEventListener('visibilitychange', () => { if (!document.hidden && Date.now() - loadedAt > 30000) load(); });
    // The command center's Inbox tells the bell when it clears something.
    window.addEventListener('hub-inbox-changed', () => { if (isPt()) load(); });
    return {
      start() {
        // Positive Tribes previewing nobody in a client workspace still sees its own Inbox here.
        $('bell-wrap').hidden = false;
        load();
        clearInterval(timer);
        timer = setInterval(() => { if (!document.hidden) load(); }, 120000);
      },
      // After a route or preview change: the preview changes whose bell this is.
      refresh(force = false) {
        if (force || loadedFor !== whose()) { data = null; paint(); load(); }
        else if (Date.now() - loadedAt > 30000) load();
      }
    };
  })();

  $('switch').addEventListener('change', e => {
    location.hash = e.target.value === COMMAND ? '#/command' : '#/' + e.target.value + '/home';
  });
  function setPreview(email) {
    state.preview = state.people.find(u => u.email === email) || null;
    Object.assign(state, { editing: null, confirming: null, signing: null, ideaEditing: null });
    showError('');
    render();
    bell.refresh(true);
  }
  $('preview').addEventListener('change', e => setPreview(e.target.value));
  window.addEventListener('hashchange', () => { if (state.me) { route(); bell.refresh(); } });
  document.addEventListener('visibilitychange', async () => {
    if (document.hidden || !state.client || state.editing || state.mode === COMMAND) return;
    try { state.items = (await api(base() + '/items')).items; render(); } catch {}
  });
  (async () => {
    try { state.me = await api('/me'); bell.start(); await route(); }
    catch (e) { $('main').replaceChildren(h('div', { class: 'card stack' }, h('h2', {}, 'We couldn’t open your workspace'), h('p', { class: 'muted' }, e.message))); }
  })();
})();
</script>
</body>
</html>
